document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px 28px !important; border-left: none !important; border-right: none !important; }\n    .pagewrap { padding: 0 !important; }\n    h1 { font-size: 21px !important; }\n  }\n  @media print {\n    body { background:#fff; }\n    .noprint { display:none !important; }\n    .sheet { box-shadow:none !important; border:none !important; padding:0 !important; max-width:none !important; }\n    .scroller { overflow:visible !important; }\n    table { min-width:0 !important; font-size:9.5pt !important; }\n    tr { break-inside:avoid; }\n    thead { display:table-header-group; }\n    @page { size:A4 landscape; margin:10mm; }\n  }\n<\u002Fstyle>\n\n<sc-if value=\"{{ needImport }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:#f6f4ef\">\n    <div style=\"width:100%;max-width:560px;background:#fffefb;border:1px solid #e3ded2;box-shadow:0 12px 40px -28px rgba(25,24,23,.4);padding:30px 26px 26px\">\n      <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:#7a7466\">member register<\u002Fdiv>\n      <h1 style=\"margin:8px 0 0;font-size:22px;font-weight:700;line-height:1.35\">ตรวจสอบคุณสมบัติสมาชิกและการเข้าร่วมนมัสการ<\u002Fh1>\n      <div style=\"margin-top:4px;font-size:13px;color:#5d574b\">คริสตจักรคอร์เนอร์สโตน หัวหิน · จัดทำระบบโดย มน.สมเจต เสมาทอง ประธานธรรมกิจคริสตจักร<\u002Fdiv>\n\n      <div style=\"margin-top:22px;padding:14px 16px;background:#f6f8f7;border:1px solid #d9e3df\">\n        <div style=\"font-size:13.5px;font-weight:700;color:#1f5b4e\">เริ่มต้นด้วยการนำเข้าไฟล์จาก Google Sheet<\u002Fdiv>\n        <div style=\"font-size:12px;color:#41544d;margin-top:6px;line-height:1.8\">เปิด Google Sheet → ไฟล์ → ดาวน์โหลด → <b>ค่าที่คั่นด้วยจุลภาค (.csv)<\u002Fb> ทีละแท็บ แล้วเลือกทั้ง 2 ไฟล์พร้อมกัน<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:10px\">\n          <sc-for list=\"{{ partFiles }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"{{ p.style }}\">\n              <span style=\"{{ p.markStyle }}\">{{ p.mark }}<\u002Fspan>\n              <span style=\"flex:1 1 150px;min-width:0\">{{ p.label }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5d574b\">{{ p.name }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#7a7466\">{{ p.count }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <label style=\"display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:15px 16px;border:1px solid #1f5b4e;background:#fff;color:#1f5b4e;font-family:inherit;font-size:15px;font-weight:600;border-radius:2px;cursor:pointer\">\n          ⬆ เลือกไฟล์ CSV (เลือกทีเดียว 2 ไฟล์ หรือทีละไฟล์ก็ได้)\n          <input type=\"file\" accept=\".csv,text/csv\" multiple=\"\" sc-camel-on-change=\"{{ onImport }}\" style=\"display:none\">\n        <\u002Flabel>\n        <sc-if value=\"{{ partsReady }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ onApplyParts }}\" style=\"display:block;width:100%;margin-top:10px;padding:15px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:15px;font-weight:700;border-radius:2px;cursor:pointer\">บันทึกและแสดงข้อมูล →<\u002Fbutton>\n        <\u002Fsc-if>\n        <div style=\"font-size:12px;color:#1f5b4e;margin-top:10px;line-height:1.6\">{{ importMsg }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8c2f2f;margin-top:4px;line-height:1.6\">{{ importErr }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:16px;font-size:11.5px;color:#8a8477;line-height:1.8\">ข้อมูลที่นำเข้าถูกเก็บไว้ในเบราว์เซอร์ของเครื่องที่คุณใช้เท่านั้น ไม่ถูกส่งขึ้นเซิร์ฟเวอร์และไม่มีใครอื่นเห็น · เปิดหน้านี้อีกครั้งข้อมูลจะยังอยู่ จนกว่าจะกด “ล้างข้อมูลที่นำเข้า”<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ gate }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:#f6f4ef\">\n    <div style=\"width:100%;max-width:400px;background:#fffefb;border:1px solid #e3ded2;box-shadow:0 12px 40px -28px rgba(25,24,23,.4);padding:28px 24px 24px\">\n      <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:#7a7466\">members only<\u002Fdiv>\n      <h1 style=\"margin:8px 0 0;font-size:19px;font-weight:700;line-height:1.4\">ตรวจสอบคุณสมบัติสมาชิกและการเข้าร่วมนมัสการ<\u002Fh1>\n      <div style=\"margin-top:4px;font-size:12.5px;color:#5d574b;line-height:1.7\">คริสตจักรคอร์เนอร์สโตน หัวหิน · กรอกชื่อผู้ใช้และรหัสผ่านที่ประธานธรรมกิจแจ้งให้<\u002Fdiv>\n      <input value=\"{{ gEmail }}\" sc-camel-on-input=\"{{ onGEmail }}\" sc-camel-on-key-down=\"{{ onGKey }}\" placeholder=\"ชื่อผู้ใช้ (User)\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:16px;padding:12px 13px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px;outline:none\">\n      <input type=\"password\" value=\"{{ gPass }}\" sc-camel-on-input=\"{{ onGPass }}\" sc-camel-on-key-down=\"{{ onGKey }}\" placeholder=\"รหัสผ่าน (Password)\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:12px 13px;border:1px solid #cfc8b8;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:14px;border-radius:2px;outline:none\">\n      <button sc-camel-on-click=\"{{ onGateLogin }}\" style=\"display:block;width:100%;margin-top:10px;padding:13px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:15px;font-weight:600;border-radius:2px;cursor:pointer\">เข้าดูข้อมูล<\u002Fbutton>\n      <div style=\"font-size:12.5px;color:#8c2f2f;margin-top:10px;line-height:1.6\">{{ gErr }}<\u002Fdiv>\n      <div style=\"margin-top:14px;font-size:11px;color:#a09884;line-height:1.7\">ข้อมูลนี้เป็นข้อมูลภายในของคริสตจักร โปรดไม่ส่งต่อ<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ needLogin }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:#f6f4ef\">\n    <div style=\"width:100%;max-width:420px;background:#fffefb;border:1px solid #e3ded2;box-shadow:0 12px 40px -28px rgba(25,24,23,.4);padding:30px 26px 26px\">\n      <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:#7a7466\">member register<\u002Fdiv>\n      <h1 style=\"margin:8px 0 0;font-size:22px;font-weight:700;line-height:1.35\">คริสตจักรคอร์เนอร์สโตน หัวหิน<\u002Fh1>\n      <div style=\"margin-top:4px;font-size:13.5px;color:#5d574b\">ระบบทะเบียนสมาชิกและการเข้าร่วมนมัสการ<\u002Fdiv>\n      <div style=\"margin-top:22px;font-size:12.5px;color:#5d574b\">ใส่รหัสที่ได้รับเพื่อเข้าดูข้อมูล<\u002Fdiv>\n      <input type=\"password\" value=\"{{ pw }}\" sc-camel-on-input=\"{{ onPw }}\" sc-camel-on-key-down=\"{{ onPwKey }}\" placeholder=\"รหัสผ่าน\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:13px 14px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:16px;border-radius:2px;outline:none\">\n      <div style=\"font-size:12.5px;color:#8c2f2f;min-height:18px;margin-top:6px\">{{ loginError }}<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onLogin }}\" style=\"{{ loginBtnStyle }}\">{{ loginBtnLabel }}<\u002Fbutton>\n      <div style=\"margin-top:16px;font-size:11.5px;color:#8a8477;line-height:1.7\">ข้อมูลในไฟล์นี้เข้ารหัส AES-256 · ไม่มีรหัสจะเปิดอ่านไม่ได้ · ผู้ดูแลใช้รหัสผู้ดูแลเพื่อแก้ไขและจัดการรหัส<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ authed }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"pagewrap\" style=\"min-height:100vh;padding:28px 20px 64px\">\n  <div class=\"sheet\" style=\"max-width:1320px;margin:0 auto;background:#fffefb;border:1px solid #e3ded2;box-shadow:0 1px 0 #e9e4d8,0 12px 40px -28px rgba(25,24,23,.35);padding:32px 34px 40px\">\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #191817;padding-bottom:11px\">\n      <div style=\"flex:1 1 300px;min-width:0\">\n        <div style=\"font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:#7a7466\">worship register + members list / audit<\u002Fdiv>\n        <h1 style=\"margin:3px 0 0;font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.25\">ตรวจสอบคุณสมบัติสมาชิกและการเข้าร่วมนมัสการ<\u002Fh1>\n        <div style=\"margin-top:3px;font-size:12.5px;color:#5d574b;line-height:1.5\">เรียงจากผู้ที่เป็นสมาชิกเก่าที่สุดและมาต่อเนื่อง · จัดทำระบบโดย มน.สมเจต เสมาทอง ประธานธรรมกิจคริสตจักร<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:0 1 auto;min-width:max-content;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5d574b;line-height:1.6\">\n        <div style=\"display:flex;gap:5px;justify-content:flex-end;align-items:center;margin-bottom:5px\">\n          <button sc-camel-on-click=\"{{ onToggleRules }}\" title=\"คุณสมบัติสมาชิกและสิทธิ์ออกเสียง\" style=\"display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;font-weight:600;border-radius:2px;cursor:pointer\" style-hover=\"border-color:#1f5b4e;color:#1f5b4e\">\n            <span style=\"font-family:'IBM Plex Mono',monospace\">ⓘ<\u002Fspan>คุณสมบัติสมาชิก\n          <\u002Fbutton>\n          <span style=\"{{ modeStyle }}\">{{ modeText }}<\u002Fspan>\n          <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ onOpenProfile }}\" style=\"padding:4px 10px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:12px;font-weight:600;border-radius:2px;cursor:pointer\">โปรไฟล์<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ onLogout }}\" style=\"padding:4px 10px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">ออก<\u002Fbutton>\n        <\u002Fdiv>\n        <div>ทะเบียนสมาชิก {{ memberCount }} คน · บันทึกนมัสการ {{ recordCount }} รายการ / {{ serviceCount }} ครั้ง<\u002Fdiv>\n        <div>{{ rangeText }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showRules }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:18px;padding:18px 20px;background:#faf8f3;border:1px solid #e3ded2\">\n        <div style=\"display:flex;gap:16px;justify-content:space-between;align-items:flex-start\">\n          <div>\n            <div style=\"font-size:15px;font-weight:700\">1. คุณสมบัติ ผู้มีสิทธิ์เข้าร่วมประชุมและออกเสียงโหวต<\u002Fdiv>\n            <div style=\"font-size:12px;color:#7a7466;margin-top:2px\">อ้างอิงระเบียบสมาชิกภาพของคริสตจักร<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onToggleRules }}\" class=\"noprint\" style=\"padding:6px 12px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">ปิด<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;margin-top:14px\">\n          <sc-for list=\"{{ rules }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"{{ r.cardStyle }}\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"{{ r.numStyle }}\">{{ r.no }}<\u002Fspan>\n                <span style=\"{{ r.titleStyle }}\">{{ r.title }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.8;margin-top:7px;text-wrap:pretty;color:#2b2926\">{{ r.body }}<\u002Fdiv>\n              <div style=\"{{ r.rightStyle }}\">{{ r.right }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 6px\">\n      <div style=\"flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:6px\">\n        <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"16\">\n          <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">\n            <div style=\"{{ f.labelStyle }}\">{{ f.label }}<\u002Fdiv>\n            <div style=\"{{ f.countStyle }}\">{{ f.count }}<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-raw-select value=\"{{ tierSel }}\" sc-camel-on-change=\"{{ onTier }}\" style=\"padding:10px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px\">\n        <sc-for list=\"{{ tierOptions }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <option value=\"{{ t.value }}\">{{ t.label }}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <sc-raw-select value=\"{{ group }}\" sc-camel-on-change=\"{{ onGroup }}\" style=\"padding:10px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px\">\n        <sc-for list=\"{{ groupOptions }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <option value=\"{{ g.value }}\">{{ g.label }}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <button sc-camel-on-click=\"{{ onPrint }}\" style=\"padding:10px 18px;border:1px solid #191817;background:#191817;color:#fffefb;font-family:inherit;font-size:14px;font-weight:600;border-radius:2px;cursor:pointer\" style-hover=\"background:#1f5b4e;border-color:#1f5b4e\">พิมพ์ / บันทึก PDF<\u002Fbutton>\n      <sc-if value=\"{{ canImport }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ onToggleAdmin }}\" style=\"{{ adminBtnStyle }}\">{{ adminBtnLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;margin:14px 0 0;background:#f6f8f7;border:1px solid #d9e3df\">\n        <div style=\"flex:1 1 100%;font-size:12.5px;color:#41544d;line-height:1.6\">\n          <b>อัปเดตข้อมูลจาก Google Sheet<\u002Fb> — ดาวน์โหลดเป็น CSV แล้วเลือกไฟล์ <span style=\"font-family:'IBM Plex Mono',monospace\">MembersList<\u002Fspan> และ <span style=\"font-family:'IBM Plex Mono',monospace\">worshipRegister<\u002Fspan> (ทีเดียว 2 ไฟล์ หรือทีละไฟล์) · เก็บไว้ในเครื่องนี้ · สถานะที่ปรับไว้เองไม่หาย\n        <\u002Fdiv>\n        <div style=\"flex:1 1 100%;display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ partFiles }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"{{ p.style }}\">\n              <span style=\"{{ p.markStyle }}\">{{ p.mark }}<\u002Fspan>\n              <span style=\"flex:1 1 150px;min-width:0\">{{ p.label }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5d574b\">{{ p.name }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#7a7466\">{{ p.count }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <label style=\"display:inline-flex;align-items:center;gap:6px;padding:11px 16px;border:1px solid #1f5b4e;background:#fff;color:#1f5b4e;font-family:inherit;font-size:14px;font-weight:600;border-radius:2px;cursor:pointer\">\n          ⬆ เลือกไฟล์ CSV\n          <input type=\"file\" accept=\".csv,text/csv\" multiple=\"\" sc-camel-on-change=\"{{ onImport }}\" style=\"display:none\">\n        <\u002Flabel>\n        <button sc-camel-on-click=\"{{ onApplyParts }}\" style=\"padding:11px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:14px;font-weight:700;border-radius:2px;cursor:pointer\">บันทึกและแสดงข้อมูล<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onClearImport }}\" style=\"padding:11px 14px;border:1px solid #cfc8b8;background:#fff;color:#8c2f2f;font-family:inherit;font-size:13px;border-radius:2px;cursor:pointer\">ล้างข้อมูลที่นำเข้า<\u002Fbutton>\n        <div style=\"flex:1 1 100%;font-size:12px;color:#1f5b4e;line-height:1.6\">{{ importMsg }}{{ importedAt }}<\u002Fdiv>\n        <div style=\"flex:1 1 100%;font-size:12px;color:#8c2f2f;line-height:1.6\">{{ importErr }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;margin:10px 0 4px;background:#f6f8f7;border:1px solid #d9e3df\">\n        <div style=\"flex:1 1 300px;min-width:0;font-size:12.5px;color:#41544d;line-height:1.6\">แก้สถานะได้ที่ป้ายผลตรวจในตาราง ({{ overrideCount }} รายชื่อถูกกำหนดเอง) แล้วกดบันทึก · การแก้ไขเก็บในเครื่องนี้ · ถ้าต้องการให้ทีมงานเห็นด้วย ให้เปิดโปรไฟล์แล้วกด “บันทึกและสร้างไฟล์ใหม่” เพื่อนำไปอัปทับบน GitHub<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onSave }}\" style=\"{{ saveStyle }}\">{{ saveLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onReset }}\" style=\"padding:10px 14px;border:1px solid #cfc8b8;background:#fff;color:#8c2f2f;font-family:inherit;font-size:13px;border-radius:2px;cursor:pointer\" style-hover=\"border-color:#8c2f2f\">ล้างการปรับทั้งหมด<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:12px 14px;margin:12px 0 4px;background:#f3f5f7;border:1px solid #dde3e8;font-size:12.5px;color:#3c4a57;line-height:1.6\">ไฟล์นี้เป็นฉบับสำหรับผู้ดู — ดูข้อมูล ค้นหา กรอง และพิมพ์ได้ แต่ไม่สามารถแก้สถานะสมาชิกได้<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <input class=\"noprint\" value=\"{{ query }}\" sc-camel-on-input=\"{{ onQuery }}\" placeholder=\"ค้นหาชื่อ / ชื่อเล่น / รหัส / หมายเหตุ\" style=\"display:block;width:100%;box-sizing:border-box;margin:16px 0 0;padding:10px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px;outline:none\">\n    <div style=\"font-size:12.5px;color:#5d574b;margin:12px 0 10px\"><b>{{ selectionText }}<\u002Fb> · แสดง {{ shownCount }} รายชื่อ<\u002Fdiv>\n\n    <div class=\"scroller\" style=\"overflow-x:auto\">\n    <sc-raw-table style=\"width:100%;min-width:1240px;border-collapse:collapse;font-size:13px\">\n      <sc-raw-thead>\n        <sc-raw-tr style=\"background:#f1eee6\">\n          <sc-raw-th style=\"text-align:right;padding:9px 8px;border-bottom:1.5px solid #191817;font-weight:600;white-space:nowrap;width:40px\">#<\u002Fsc-raw-th>\n          <sc-for list=\"{{ heads }}\" as=\"h\" hint-placeholder-count=\"9\">\n            <sc-raw-th style=\"{{ h.thStyle }}\" title=\"{{ h.title }}\">\n              <button sc-camel-on-click=\"{{ h.onClick }}\" style=\"{{ h.btnStyle }}\">{{ h.label }}<span style=\"{{ h.arrowStyle }}\">{{ h.arrow }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-raw-th>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"14\">\n          <sc-raw-tr style=\"{{ r.rowStyle }}\">\n            <sc-raw-td style=\"text-align:right;padding:8px;font-family:'IBM Plex Mono',monospace;color:#7a7466;vertical-align:top;white-space:nowrap\">{{ r.rank }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px 10px;vertical-align:top\">\n              <div style=\"font-weight:600\">{{ r.name }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#7a7466;margin-top:2px\">{{ r.meta }}<\u002Fdiv>\n            <\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px 10px;vertical-align:top\">\n              <div style=\"position:relative\">\n                <button sc-camel-on-click=\"{{ r.onBadge }}\" style=\"{{ r.badgeStyle }}\">{{ r.badge }}<span style=\"opacity:.7;font-size:9px\">{{ r.caret }}<\u002Fspan><\u002Fbutton>\n                <sc-if value=\"{{ r.menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"noprint\" style=\"position:absolute;z-index:20;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid #cfc8b8;box-shadow:0 8px 24px -10px rgba(25,24,23,.4);border-radius:2px;overflow:hidden;min-width:170px\">\n                    <sc-for list=\"{{ r.menuItems }}\" as=\"m\" hint-placeholder-count=\"3\">\n                      <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"font-size:10.5px;margin-top:4px;color:{{ r.flagColor }};font-weight:{{ r.flagWeight }}\">{{ r.flag }}<\u002Fdiv>\n            <\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;font-family:'IBM Plex Mono',monospace;vertical-align:top;white-space:nowrap\">{{ r.join }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;font-family:'IBM Plex Mono',monospace;vertical-align:top;white-space:nowrap;color:#5d574b\">{{ r.first }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;text-align:right;font-family:'IBM Plex Mono',monospace;vertical-align:top;white-space:nowrap\">{{ r.tenure }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;vertical-align:top;white-space:nowrap\">{{ r.visits }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;text-align:right;font-family:'IBM Plex Mono',monospace;vertical-align:top;white-space:nowrap\">{{ r.recent }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px 10px;vertical-align:top\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <div style=\"flex:1;height:6px;background:#eae5d9;position:relative;overflow:hidden\">\n                  <div style=\"{{ r.barStyle }}\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5d574b;width:34px;text-align:right\">{{ r.contText }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;font-family:'IBM Plex Mono',monospace;vertical-align:top;white-space:nowrap;color:{{ r.lastColor }}\">{{ r.last }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:24px;padding-top:14px;border-top:1px solid #e3ded2;font-size:11.5px;color:#7a7466;line-height:1.8\">\n      <div><b>สถานะทางทะเบียนกับผลวิเคราะห์แยกกัน<\u002Fb> คอลัมน์ “ผลตรวจ” คือผลการวิเคราะห์จากประวัติการนมัสการเพื่อใช้ประกอบการพิจารณาของคณะธรรมกิจ ไม่ใช่การเปลี่ยนสถานภาพทางทะเบียนอัตโนมัติ · สถานะตามทะเบียนเดิมแสดงอยู่ใต้ชื่อของแต่ละคน · การเปลี่ยนสถานภาพต้องผ่านขั้นตอนและมติที่เกี่ยวข้อง · เกณฑ์วิเคราะห์เพิ่มเติม “เข้าเกณฑ์เข้มแข็ง” คือผู้ที่มีความต่อเนื่องในการนมัสการตั้งแต่ 50% ขึ้นไปของจำนวนครั้งที่จัดนับจากวันเข้าร่วม (ต่ำกว่า 50% ไม่นับ)<\u002Fdiv>\n      <div><b>การรวมข้อมูล<\u002Fb> ใช้ทะเบียนสมาชิก (MembersList) เป็นข้อมูลหลักของสถานะ/กลุ่ม/รหัส — รายชื่อซ้ำใช้รายการที่อัพเดทล่าสุด — และใช้บันทึกลงชื่อนมัสการคำนวณจำนวนครั้งและความต่อเนื่อง · <b>อายุสมาชิก<\u002Fb> นับจากวันที่เก่ากว่าระหว่างวันเข้าเป็นสมาชิกกับวันนมัสการครั้งแรก<\u002Fdiv>\n      <div><b>ลำดับหมวด<\u002Fb> 1) <b>สมาชิกสมบูรณ์<\u002Fb> (อายุสมาชิกครบ {{ minYearsText }} ปี และเข้าร่วมนมัสการต่อเนื่อง · เรียงจากผู้ที่เก่าที่สุด) → 2) <b>สมาชิกสมบูรณ์ · ต้องตักเตือน<\u002Fb> (ขาดการนมัสการครบ 1 ปี คณะธรรมกิจส่งผู้แทนหรือหนังสือไปตักเตือน · ข้อ 93.4(4)) → 3) <b>สมาชิกสำรอง · พ้นสมบูรณ์<\u002Fb> (ยังคงขาดจนถึงเวลาสามปี ให้พ้นจากการเป็นสมาชิกสมบูรณ์ แต่คงสถานภาพเป็นสมาชิกสำรองไว้ จนกว่าคณะธรรมกิจจะมีมติให้กลับเป็นสมาชิกสมบูรณ์อีกครั้ง · ข้อ 93.4(4)) → 4) สมาชิกสำรอง → 5) สมาชิกสำรอง · ต้องตักเตือน (ขาดครบ 1 ปี) → 6) พ้นสมาชิกสำรอง (ขาดครบ 3 ปี · ข้อ 94.6(4)) → 7) ผู้ร่วมนมัสการ → 8) ลาออก → 9) ย้ายสังกัด → 10) ให้ออกโดยมติธรรมกิจ (ประพฤติผิดร้ายแรง) → 11) เสียชีวิต<\u002Fdiv>\n      <div><b>ระดับการขาดการนมัสการ<\u002Fb> คำขยายใต้ป้ายแบ่งระดับด้วยสีต่างกัน ไล่แดงเข้มขึ้นทุกปี — เกิน 1 ปี (ส้มแดง) · 2 ปี (แดง) · 3 ปี (แดงเข้ม) · 4 ปีขึ้นไป (แดงเข้มสุด) เรียงจากขาดน้อยที่สุดไปมากที่สุด · เลือกดูแยกแต่ละระดับได้จากดรอปดาวน์คุณสมบัติ<\u002Fdiv>\n      <div><b>การขาดการนมัสการ<\u002Fb> คำนวณจากวันที่ลงชื่อนมัสการครั้งล่าสุดถึงวันที่จริงของวันที่เปิดเว็บ (ผู้ที่ไม่มีบันทึกลงชื่อเลย นับจากวันเข้าเป็นสมาชิก) · ใต้ป้ายมีตัวเลขจริงว่าขาดไปกี่เดือนกี่วัน เรียงจากขาดน้อยไปมาก · ผู้ดูแลคลิกป้ายผลตรวจเพื่อกำหนดเป็น “สมาชิกสำรอง” “ลาออก” “ย้ายสังกัด” “ให้ออกโดยมติธรรมกิจ” หรือ “เสียชีวิต” ตามมติธรรมกิจ ค่าที่กำหนดถูกบันทึกไว้ในเครื่องและฝังลงในไฟล์แชร์ · เปิดไฟล์ด้วย ?view ท้าย URL ก็จะเป็นโหมดผู้ดูเช่นกัน<\u002Fdiv>\n      <div style=\"margin-top:10px;padding-top:8px;border-top:1px solid #eee9dd;color:#5d574b\">จัดทำระบบโดย <b>มน.สมเจต เสมาทอง<\u002Fb> ประธานธรรมกิจคริสตจักร · <span style=\"font-family:'IBM Plex Mono',monospace\">จัดทำ {{ today }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showProfile }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"noprint\" sc-camel-on-click=\"{{ onBackdrop }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(25,24,23,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto\">\n    <div sc-camel-on-click=\"{{ stopClick }}\" style=\"width:100%;max-width:560px;background:#fffefb;border:1px solid #e3ded2;box-shadow:0 24px 60px -30px rgba(25,24,23,.6)\">\n      <div style=\"position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #e3ded2;background:#fffefb\">\n        <div>\n          <div style=\"font-size:16px;font-weight:700\">โปรไฟล์ผู้ดูแล<\u002Fdiv>\n          <div style=\"font-size:12px;color:#7a7466;margin-top:2px\">{{ adminUser }} · ข้อมูลอัพเดท {{ dataUpdated }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onCloseProfile }}\" style=\"padding:7px 13px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:13px;border-radius:2px;cursor:pointer\">ปิด<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px 20px;border-bottom:1px solid #eee9dd;background:#f6f8f7\">\n        <div style=\"font-size:13.5px;font-weight:700\">อัปเดตข้อมูลจาก Google Sheet<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#41544d;margin:4px 0 10px;line-height:1.75\">เปิด Google Sheet → ไฟล์ → ดาวน์โหลด → <b>ค่าที่คั่นด้วยจุลภาค (.csv)<\u002Fb> ทีละแท็บ แล้วเลือกทั้ง 2 ไฟล์พร้อมกันในช่องด้านล่าง<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:10px;padding:10px 12px;background:#fffefb;border:1px solid #d9e3df\">\n          <div style=\"font-size:11px;color:#7a7466;font-weight:600\">ไฟล์ที่ต้องอัปโหลด 2 ไฟล์<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12.5px;color:#2b2926\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;background:#eef3f1;border:1px solid #cfdcd7;padding:2px 7px;border-radius:2px\">MembersList.csv<\u002Fspan>\n            <span>ทะเบียนสมาชิก<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12.5px;color:#2b2926\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;background:#eef3f1;border:1px solid #cfdcd7;padding:2px 7px;border-radius:2px\">worshipRegister.csv<\u002Fspan>\n            <span>บันทึกลงชื่อนมัสการ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <input type=\"file\" accept=\".csv,text/csv\" multiple=\"\" sc-camel-on-change=\"{{ onImport }}\" style=\"display:block;width:100%;box-sizing:border-box;padding:10px;border:1px dashed #9db3ab;background:#fff;font-family:inherit;font-size:13px;border-radius:2px\">\n        <div style=\"font-size:11.5px;color:#41544d;margin-top:8px;line-height:1.7\">ระบบจะคำนวณใหม่จากข้อมูลล่าสุด <b>โดยที่สถานะที่คุณปรับไว้เองยังคงอยู่<\u002Fb> · รับเฉพาะไฟล์ .csv (ไฟล์ .xlsx อ่านไม่ได้)<\u002Fdiv>\n        <div style=\"font-size:12px;color:#1f5b4e;margin-top:8px;line-height:1.6\">{{ importMsg }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8c2f2f;margin-top:4px;line-height:1.6\">{{ importErr }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px 20px;border-bottom:1px solid #eee9dd\">\n        <div style=\"font-size:13.5px;font-weight:700;margin-bottom:8px\">ชื่อผู้ใช้ผู้ดูแล<\u002Fdiv>\n        <input value=\"{{ pfUser }}\" sc-camel-on-input=\"{{ onPfUser }}\" style=\"display:block;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:15px;border-radius:2px;outline:none\">\n      <\u002Fdiv>\n\n      <div style=\"padding:18px 20px;border-bottom:1px solid #eee9dd\">\n        <div style=\"font-size:13.5px;font-weight:700\">รหัสผู้ดูแล<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#7a7466;margin:3px 0 8px;line-height:1.6\">พิมพ์รหัสที่ต้องการได้เลย ระบบจะแสดงค้างไว้แบบนี้ · ถ้าจะเปลี่ยนรหัสเข้าไฟล์ที่เข้ารหัส ต้องยาว 10 ตัวขึ้นไป<\u002Fdiv>\n        <input value=\"{{ pfNewPass }}\" sc-camel-on-input=\"{{ onPfNewPass }}\" placeholder=\"รหัสผู้ดูแล\" style=\"display:block;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:15px;border-radius:2px;outline:none\">\n      <\u002Fdiv>\n\n      <div style=\"padding:18px 20px;border-bottom:1px solid #eee9dd\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n          <div>\n            <div style=\"font-size:13.5px;font-weight:700\">{{ codesTitle }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#7a7466;margin-top:3px;line-height:1.6\">{{ codesNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ canEditCodes }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ onAddCode }}\" style=\"padding:8px 12px;border:1px solid #1f5b4e;background:#fff;color:#1f5b4e;font-family:inherit;font-size:12.5px;font-weight:600;border-radius:2px;cursor:pointer;white-space:nowrap\">+ เพิ่มรหัส<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:12px\">\n          <sc-for list=\"{{ pfCodes }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid #e3ded2;background:#faf8f3\">\n              <input value=\"{{ c.label }}\" sc-camel-on-input=\"{{ c.onLabel }}\" sc-camel-read-only=\"{{ codesLocked }}\" placeholder=\"ชื่อผู้รับ / กลุ่ม\" style=\"{{ codeInputStyle }}\">\n              <input value=\"{{ c.code }}\" sc-camel-on-input=\"{{ c.onCode }}\" sc-camel-read-only=\"{{ codesLocked }}\" placeholder=\"รหัส\" style=\"{{ codeMonoStyle }}\">\n              <button sc-camel-on-click=\"{{ c.onCopy }}\" title=\"คัดลอกลิงก์ + ชื่อผู้ใช้ + รหัส\" style=\"{{ c.copyStyle }}\">{{ c.copyLabel }}<\u002Fbutton>\n              <sc-if value=\"{{ canEditCodes }}\" hint-placeholder-val=\"{{ true }}\">\n                <button sc-camel-on-click=\"{{ c.onRandom }}\" style=\"padding:8px 10px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">สุ่ม<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ c.onRemove }}\" style=\"padding:8px 10px;border:1px solid #cfc8b8;background:#fff;color:#8c2f2f;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">ลบ<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px 20px\">\n        <div style=\"font-size:12.5px;color:#5d574b;line-height:1.7\">กด <b>บันทึกและสร้างไฟล์ใหม่<\u002Fb> เมื่อแก้ชื่อผู้ใช้ รหัสผ่าน หรือข้อมูลเสร็จ — ระบบจะเข้ารหัสข้อมูลใหม่แล้วดาวน์โหลดเป็นไฟล์ <b>index.html<\u002Fb> ให้นำไปอัปทับไฟล์เดิมบน GitHub · รหัสเก่าจะใช้กับไฟล์ใหม่ไม่ได้ทันที<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:14px\">\n          <button sc-camel-on-click=\"{{ onRebuild }}\" style=\"{{ rebuildStyle }}\">{{ rebuildLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onLogout }}\" style=\"padding:11px 16px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:14px;border-radius:2px;cursor:pointer\">ออกจากระบบ<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#1f5b4e;margin-top:10px;line-height:1.6\">{{ pfSavedNote }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#8c2f2f;margin-top:4px;min-height:18px\">{{ pfError }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>]]&gt;\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;minYears&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;ปี&quot;,&quot;section&quot;:&quot;เกณฑ์สมาชิกสมบูรณ์&quot;},&quot;absentMonths&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:24,&quot;step&quot;:1,&quot;unit&quot;:&quot;เดือน&quot;,&quot;section&quot;:&quot;เกณฑ์สมาชิกสมบูรณ์&quot;}}\">\nclass Component extends DCLogic {\n  state = { query:'', filter:'all', group:'', ready:false, menuFor:null, overrides:{}, locked:true, dirty:false, savedAt:'',\n    role:'', pw:'', loginError:'', loggingIn:false, showProfile:false,\n    pfUser:'', pfNewPass:'', pfCodes:[], pfError:'', rebuilding:false, importMsg:'', importErr:'',\n    sortKey:'', sortDir:1, adminOpen:false, viewers:[], vEmail:'', vPass:'', vErr:'',\n    gate: !sessionStorage.getItem('wr-who'), gEmail:'', gPass:'', gErr:'' };\n\n  // ── รหัสผู้ดูจาก Google Sheet ที่เผยแพร่เป็น CSV (แก้จากมือถือได้ มีผลทันที) ──\n  sheetUrl(){ return ''; }   // ปิดการดึงรหัสจาก Google Sheet (ไม่เผยแพร่รหัสผ่านสาธารณะ)\n  sheetUrlDisabled(){\n    let local = null;\n    try { local = JSON.parse(localStorage.getItem('wr-admin-cfg') || 'null'); } catch(e){}\n    return ((local && local.sheet) || (window.WR_ACCOUNTS && window.WR_ACCOUNTS.sheet) || '').trim();\n  }\n\n  async fetchSheetAccounts(){\n    const url = this.sheetUrl();\n    if (!url) return;\n    this.setState({sheetState:'กำลังตรวจสอบรหัสจาก Google Sheet…'});\n    try {\n      const ctl = new AbortController();\n      const timer = setTimeout(()=>ctl.abort(), 8000);\n      let text;\n      try {\n        const res = await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now(),\n          {cache:'no-store', signal:ctl.signal});\n        if (!res.ok) throw new Error('HTTP ' + res.status);\n        text = await res.text();\n      } finally { clearTimeout(timer); }\n      const rows = this.parseCSV(text).filter(r=>r.some(c=>(c||'').trim()));\n      const out = [];\n      for (const r of rows) {\n        const user = (r[0]||'').trim(), pass = (r[1]||'').trim();\n        if (!user || !pass) continue;\n        if (/^(ชื่อ|user|username|ผู้ใช้)/i.test(user)) continue;   // ข้ามแถวหัวตาราง\n        out.push({label:user, code:pass});\n      }\n      this._remote = out;\n      if (out.length) this.setState({pfCodes: out.map(o=>({label:o.label, code:o.code}))});\n      this.setState({sheetState: out.length\n        ? 'อ่านรหัสจาก Google Sheet สำเร็จ · ' + out.length + ' รายชื่อ (' + out.map(o=>o.label).join(', ') + ')'\n        : 'เชื่อมต่อ Sheet ได้ แต่ไม่พบรายชื่อ — คอลัมน์ A = ชื่อผู้ใช้, คอลัมน์ B = รหัสผ่าน'});\n    } catch(e){\n      this._remote = null;\n      this.setState({sheetState:'อ่าน Sheet ไม่ได้: ' + e.message + ' — ตรวจว่าได้ “เผยแพร่ไปยังเว็บ” เป็น CSV แล้ว'});\n    }\n  }\n\n  accounts(){\n    const baked = window.WR_ACCOUNTS || {};\n    let local = null;\n    try { local = JSON.parse(localStorage.getItem('wr-admin-cfg') || 'null'); } catch(e){}\n    if (this._remote) {\n      const admin = {\n        user: (local && local.user) || baked.adminUser || 'Admin',\n        pass: (local && local.pass) || baked.adminPass || '132435qewret',\n      };\n      return {admin, viewers: this._remote.map(v=>({user:v.label, pass:v.code}))};\n    }\n    const admin = {\n      user: (local && local.user) || baked.adminUser || 'Admin',\n      pass: (local && local.pass) || baked.adminPass || '132435qewret',\n    };\n    const viewers = ((local && local.codes) || baked.viewers || [])\n      .filter(v=>v && v.label && v.code)\n      .map(v=>({user:String(v.label).trim(), pass:String(v.code).trim()}));\n    return {admin, viewers};\n  }\n\n  loadViewers(){\n    try { const v = JSON.parse(localStorage.getItem('wr-viewers') || '[]'); if (Array.isArray(v)) return v; } catch(e){}\n    return (window.WR_VIEWERS || []).slice();\n  }\n  saveViewers(list){\n    this.setState({viewers:list});\n    try { localStorage.setItem('wr-viewers', JSON.stringify(list)); } catch(e){}\n  }\n  addViewer(){\n    const email = this.state.vEmail.trim().toLowerCase(), pass = this.state.vPass.trim();\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) { this.setState({vErr:'รูปแบบอีเมลไม่ถูกต้อง'}); return; }\n    if (pass.length < 4) { this.setState({vErr:'รหัสต้องยาวอย่างน้อย 4 ตัว'}); return; }\n    const list = this.state.viewers.filter(v=>v.email !== email).concat([{email, pass, at:this.todayISO()}]);\n    this.saveViewers(list);\n    this.setState({vEmail:'', vPass:'', vErr:''});\n  }\n  removeViewer(email){\n    if (!confirm('ลบสิทธิ์ของ ' + email + ' ?\\nไฟล์/ลิงก์แชร์ที่สร้างใหม่หลังจากนี้ เขาจะเข้าไม่ได้')) return;\n    this.saveViewers(this.state.viewers.filter(v=>v.email !== email));\n  }\n  async gateLogin(){\n    const user = this.state.gEmail.trim(), pass = this.state.gPass.trim();\n    if (!user || !pass) { this.setState({gErr:'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'}); return; }\n    if (window.WR_ENC) {\n      this.setState({gErr:'กำลังตรวจสอบ…'});\n      const E = window.WR_ENC;\n      const isAdminName = user.toLowerCase() === String(E.user || 'Admin').toLowerCase();\n      const vLabels = (E.viewers||[]).map(v=>String(v.label||'').toLowerCase());\n      if (!isAdminName && !vLabels.includes(user.toLowerCase())) {\n        this.setState({gErr:'ไม่พบชื่อผู้ใช้นี้ในระบบ'}); return;\n      }\n      await this.tryLogin(pass);\n      if (!this.state.ready) this.setState({gErr:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'});\n      return;\n    }\n    let A = this.accounts();\n    // ผู้ดูแลตรวจก่อนเสมอ ไม่ต้องรอ Google Sheet\n    if (user.toLowerCase() !== A.admin.user.toLowerCase() || pass !== A.admin.pass) {\n      const hit = A.viewers.some(v=>v.user.trim().toLowerCase() === user.toLowerCase() && v.pass.trim() === pass);\n      if (!hit && this.sheetUrl() && !this._remote) {\n        this.setState({gErr:'กำลังตรวจสอบรหัส…'});\n        await this.fetchSheetAccounts();\n        A = this.accounts();\n      }\n    }\n    if (user.toLowerCase() === A.admin.user.toLowerCase() && pass === A.admin.pass) {\n      try { sessionStorage.setItem('wr-who', 'admin:'+user); } catch(e){}\n      this.setState({gate:false, gErr:''});\n      this.finishLogin('admin');\n      return;\n    }\n    const v = A.viewers.find(v=>v.user.trim().toLowerCase() === user.toLowerCase() && v.pass.trim() === pass);\n    if (!v) {\n      this.setState({gErr: (A.viewers.length\n        ? 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง หรือสิทธิ์ถูกยกเลิกแล้ว'\n        : 'ยังไม่มีรายชื่อผู้มีสิทธิ์ดูในระบบ — โปรดแจ้งประธานธรรมกิจ')\n        + ' · (ตรวจพบ ' + A.viewers.length + ' รายชื่อ'\n        + (this._remote ? ' จาก Google Sheet' : (this.sheetUrl() ? ' — อ่าน Sheet ไม่สำเร็จ' : ' จากไฟล์'))\n        + ': ' + A.viewers.map(v=>v.user).join(', ') + ')'});\n      return;\n    }\n    try { sessionStorage.setItem('wr-who', 'viewer:'+v.user); } catch(e){}\n    if (location.hash) history.replaceState(null, '', location.pathname);\n    this.setState({gate:false, gErr:''});\n    this.finishLogin('viewer');\n  }\n\n  toggleSort(key){\n    const {sortKey, sortDir} = this.state;\n    if (sortKey !== key) this.setState({sortKey:key, sortDir: key==='name' ? 1 : -1});\n    else if (sortDir === (key==='name' ? 1 : -1)) this.setState({sortDir: -sortDir});\n    else this.setState({sortKey:'', sortDir:1});\n  }\n\n  componentDidMount(){\n    // เก็บกวาดข้อความ ]]> ที่หลุดจาก CDATA ของเทมเพลต\n    const sweep = () => document.querySelectorAll('.sc-host').forEach(h=>{\n      h.childNodes.forEach(n=>{ if (n.nodeType === 3 && n.nodeValue.indexOf(']]>') >= 0) n.nodeValue = ''; });\n    });\n    [0, 300, 1200].forEach(t=>setTimeout(sweep, t));\n    this._onDocClick = () => { if (this.state.menuFor) this.setState({menuFor:null}); };\n    document.addEventListener('click', this._onDocClick);\n    if (location.hash) history.replaceState(null, '', location.pathname);\n    this._esc = e=>{ if (e.key === 'Escape' && this.state.showProfile) this.setState({showProfile:false}); };\n    window.addEventListener('keydown', this._esc);\n    this.setState({pfSheet: this.sheetUrl()});\n    this.fetchSheetAccounts();\n    if (window.WR_ENC) {\n      const sess = sessionStorage   badgeStyle: badgeStyle(r),\n        caret: this.state.locked ? '' : '▾',\n        onBadge: this.state.locked ? undefined : (e)=>{ e.stopPropagation(); this.setState({menuFor: this.state.menuFor===r.name ? null : r.name}); },\n        menuOpen: !this.state.locked && this.state.menuFor === r.name,\n        menuItems: [\n          {key:'', label:'ตามการคำนวณ (' + LABEL[r.baseTier] + ')', color:'#1f5b4e'},\n          {key:'spare', label:'สมาชิกสำรอง', color:'#7a6ca8'},\n          {key:'attender', label:'ผู้ร่วมนมัสการ', color:'#8a8477'},\n          {key:'resigned', label:'ลาออก', color:'#9a7b3f'},\n          {key:'transferred', label:'ย้ายสังกัด', color:'#3f6b8a'},\n          {key:'expelled', label:'ให้ออกโดยมติธรรมกิจ', color:'#8c2f2f'},\n          {key:'deceased', label:'เสียชีวิต', color:'#4a4a4a'},\n        ].map((m,i)=>{\n          const on = (r.over||'') === m.key;\n          return {label:m.label, onClick:(e)=>{ e.stopPropagation(); this.setOverride(r.name, m.key||null); },\n            style:`display:block;width:100%;text-align:left;padding:8px 12px;border:none;${i?'border-top:1px solid #eee9dd;':''}background:${on?'#f3f1ea':'#fff'};font-family:inherit;font-size:12.5px;color:${m.color};font-weight:${on?600:400};cursor:pointer;white-space:nowrap`};\n        }),\n        flag: noteOf(r),\n        flagColor: (r.tier===1 || r.tier===2 || r.tier===4 || r.tier===5) ? BAND_COLOR[bandOf(r)] : '#7a7466',\n        flagWeight: (r.tier>=1 && r.tier<=5) ? 600 : 400,\n        join: this.th(r.sen),\n        first: this.th(r.firstAtt),\n        last: r.visits ? this.th(r.last) : '—',\n        lastColor: r.gap > 26 ? '#9a4a25' : '#191817',\n        tenure: r.sen ? r.tenureY.toFixed(1)+' ปี' : '—',\n        visits: r.visits,\n        recent: r.recent + '/52',\n        contText: Math.round(r.cont*100)+'%',\n        barStyle: `position:absolute;inset:0 auto 0 0;width:${Math.round(r.cont*100)}%;background:${BAR[r.tier]}`,\n        rowStyle: `border-bottom:1px solid #eee9dd;background:${r.tier===0?'#fffefb':'#fbfaf6'}`,\n      })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
