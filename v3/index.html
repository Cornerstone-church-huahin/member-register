#fff;color:#1f5b4e;font-family:inherit;font-size:12px;font-weight:600;border-radius:2px;cursor:pointer\">{{ a.copyLabel }}<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ a.onReset }}\" style=\"padding:6px 11px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">ตั้งรหัสใหม่<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ a.onRename }}\" style=\"padding:6px 11px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">เปลี่ยนชื่อ<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ a.onToggle }}\" style=\"padding:6px 11px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">{{ a.toggleLabel }}<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ a.onRemove }}\" style=\"padding:6px 11px;border:1px solid #e0cfcf;background:#fff;color:#8c2f2f;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">ลบ<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ a.onHint }}\" style=\"padding:6px 11px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">คำใบ้รหัส<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:7px;align-items:center\">\n                  <span style=\"font-size:11px;color:#7a7466\">{{ a.pwAt }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#8a6a2f\">{{ a.hint }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#a09884\">แก้ล่าสุด {{ a.updated }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;padding:10px;border:1px dashed #cfc8b8;background:#fff\">\n            <div style=\"font-size:12.5px;font-weight:600;margin-bottom:8px\">เพิ่มบัญชีใหม่<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <input value=\"{{ naUser }}\" sc-camel-on-input=\"{{ onNaUser }}\" placeholder=\"ชื่อผู้ใช้\" style=\"flex:1 1 140px;min-width:0;padding:9px 11px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:13px;border-radius:2px;outline:none\">\n              <input type=\"password\" value=\"{{ naPass }}\" sc-camel-on-input=\"{{ onNaPass }}\" placeholder=\"รหัสผ่านที่คุณกำหนด\" style=\"flex:1 1 140px;min-width:0;padding:9px 11px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:13px;border-radius:2px;outline:none\">\n              <sc-raw-select value=\"{{ naRole }}\" sc-camel-on-change=\"{{ onNaRole }}\" style=\"padding:9px 10px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:13px;border-radius:2px\">\n                <sc-for list=\"{{ roleChoices }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <button sc-camel-on-click=\"{{ onAddAccount }}\" style=\"padding:9px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:13px;font-weight:600;border-radius:2px;cursor:pointer\">เพิ่มบัญชี<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#1f5b4e;margin-top:8px;line-height:1.6\">{{ acctMsg }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"padding:18px 20px\">\n        <div style=\"font-size:12.5px;color:#5d574b;line-height:1.75\">การเพิ่มบัญชี เปลี่ยนชื่อ ตั้งรหัสใหม่ เปลี่ยนสิทธิ์ ปิดบัญชี และผลพิจารณา <b>บันทึกลงฐานข้อมูลกลางทันที<\u002Fb> — ไม่ต้องสร้างไฟล์ใหม่และไม่ต้องอัปขึ้น GitHub<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:14px\">\n          <button sc-camel-on-click=\"{{ onLogout }}\" style=\"padding:11px 16px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:14px;border-radius:2px;cursor:pointer\">ออกจากระบบ<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#1f5b4e;margin-top:10px;line-height:1.6\">{{ pfSavedNote }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#8c2f2f;margin-top:4px;min-height:18px\">{{ pfError }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>]]&gt;\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;minYears&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;ปี&quot;,&quot;section&quot;:&quot;เกณฑ์วิเคราะห์&quot;}}\">\nclass Component extends DCLogic {\n  state = { query:'', filter:'all', group:'', ready:false, menuFor:null, overrides:{}, locked:true, dirty:false, savedAt:'',\n    role:'', pw:'', loginError:'', loggingIn:false, showProfile:false,\n    pfUser:'', pfNewPass:'', pfCodes:[], pfError:'', rebuilding:false, importMsg:'', importErr:'',\n    diagText:'', diagCopied:false, decisions:{}, meta:{},\n    decOpen:false, decRow:null, decVal:'', decDate:'', decReasons:[], decNote:'', decReview:'',\n    metaOpen:false, metaRow:null, metaOrigin:'UNKNOWN', metaIntent:'UNKNOWN', metaNote:'',\n    narrow:false, sortKey:'', sortDir:1, adminOpen:false, viewers:[], vEmail:'', vPass:'', vErr:'',\n    accounts:[], acctMsg:'', acctError:'', acctLoading:false, naUser:'', naPass:'', naRole:'viewer',\n    credOpen:false, credUser:'', credPass:'', credRole:'', credCopied:false,\n    edOpen:false, edKey:'', edName:'', edFields:null, edLabels:{}, edVer:'', edAtt:[],\n    edNewDate:'', edMsg:'', edErr:'', edTab:'member', hintUser:'', hintText:'',\n    loadPhase:'', loadStep:0, loadMsg:'', loadErr:'', ovrWarn:'',\n    pfApiUrl:'', apiState:'', copiedUser:'', needBootstrap:false, bsUser:'', bsPass:'', bsPass2:'',\n    gate: true, gEmail:'', gPass:'', gErr:'', probeMsg:'', probeOut:'' };\n\n  ss(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }\n\n  async gateLogin(){\n    // ชื่อผู้ใช้: ตัดช่องว่างหัวท้ายได้ · รหัสผ่าน: ห้ามแปลงค่าใด ๆ ทั้งสิ้น\n    const user = this.state.gEmail.trim();\n    const pass = this.state.gPass;\n    if (!this.hasApi()) { this.setState({gErr:'ยังไม่ได้ตั้งค่าที่อยู่ของฐานข้อมูลกลาง'}); return; }\n    if (!user || !pass) { this.setState({gErr:'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'}); return; }\n    this.setState({gErr:'กำลังตรวจสอบกับฐานข้อมูลกลาง… (การตรวจรหัสผ่านแบบเดิมใช้เวลาสักครู่)'});\n    const r = await this.apiLogin(user, pass);\n    if (!r.ok) this.setState({gErr: r.error || 'เข้าสู่ระบบไม่สำเร็จ'});\n  }\n\n  // ตรวจเส้นทาง POST ไปยัง Apps Script โดยไม่แตะบัญชี/รหัสผ่าน — ใช้เส้นทางเดียวกับการเข้าสู่ระบบ\n  async runTransportProbe(){\n    this.setState({probeMsg:'กำลังทดสอบการเชื่อมต่อ…', probeOut:''});\n    const nonce = 'p' + Math.random().toString(36).slice(2, 10);\n    const lines = [];\n    for (const method of ['GET','POST']) {\n      const t0 = Date.now();\n      let r;\n      try {\n        r = method === 'GET' ? await this.v3GetRaw('transportProbe', {nonce}, 60000)\n                             : await this.v3Post('transportProbe', {nonce}, 60000);\n      } catch(e){ r = {ok:false, error:String(e && e.message || e)}; }\n      const ms = Date.now() - t0;\n      const d = (r && r.data) || {};\n      lines.push([\n        method,\n        (r && r.ok === true) ? 'JSON ✓' : 'ล้มเหลว',\n        'http=' + (r && r._status !== undefined ? r._status : '?'),\n        'redirected=' + (r && r._redirected ? 'true' : 'false'),\n        'host=' + (r && r._host ? r._host : '?'),\n        'type=' + (r && r._ctype ? r._ctype : '?'),\n        'echo=' + (d.nonceReceived ? 'ok' : 'no'),\n        'build=' + (d.backendBuild || '-'),\n        ms + 'ms',\n        (r && r.ok === true) ? '' : ('· ' + String((r && r.error) || '').slice(0, 120))\n      ].join(' · '));\n    }\n    this.setState({probeMsg:'', probeOut: lines.join('\\n')});\n  }\n\n  componentDidMount(){\n    // เก็บกวาดข้อความ ]]> ที่หลุดจาก CDATA ของเทมเพลต\n    const sweep = () => document.querySelectorAll('.sc-host').forEach(h=>{\n      h.childNodes.forEach(n=>{ if (n.nodeType === 3 && n.nodeValue.indexOf(']]>') >= 0) n.nodeValue = ''; });\n    });\n    [0, 300, 1200].forEach(t=>setTimeout(sweep, t));\n    this._onDocClick = () => { if (this.state.menuFor) this.setState({menuFor:null}); };\n    document.addEventListener('click', this._onDocClick);\n    if (location.hash) history.replaceState(null, '', location.pathname);\n    this._esc = e=>{ if (e.key === 'Escape' && this.state.showProfile) this.setState({showProfile:false}); };\n    window.addEventListener('keydown', this._esc);\n    // มุมมองมือถือ/แท็บเล็ตแนวตั้ง: ต่ำกว่า 860px ใช้การ์ดแทนตาราง (ตารางมีคอลัมน์กว้าง 1240px)\n    this._onResize = () => {\n      const n = window.innerWidth < 860;\n      if (n !== this.state.narrow) this.setState({narrow:n});\n    };\n    window.addEventListener('resize', this._onResize);\n    window.addEventListener('orientationchange', this._onResize);\n    this._onResize();\n    this.setState({pfApiUrl: this.apiCfg().url});\n    if (!this.hasApi()) { this.setState({gate:false}); return; }   // ไม่มี URL ระบบ → หน้าแจ้งเตือน/ตั้งค่า\n    {                                          // โหมดฐานข้อมูลกลาง: ต้องล็อกอินก่อนเห็นข้อมูลเสมอ\n      this.setState({gate:true, gErr:''});\n      this.v3Get('health').then(r=>{\n        // COMPATIBILITY คือสถานะปกติ — ไม่ใช่ข้อผิดพลาด\n        if (r.ok) this.setState({v3Mode: r.mode || '', gErr:''});\n        else this.setState({gErr: r.error || 'ติดต่อฐานข้อมูลกลางไม่ได้'});\n      });\n      const tk = this.ss('wr-token');\n      if (tk) {                                // กลับมาใน session เดิม — เข้าหน้าหลักก่อน แล้วโหลดข้อมูล\n        this._token = tk;\n        this._role = this.ss('wr-role') || 'viewer';\n        this._acct = this.ss('wr-acct') || '';\n        this._serverRole = this._role;\n        this.setState({ready:true, gate:false, role:this._role, locked:this._role === 'viewer' || this._role === 'registrar',\n          accounts:[], loadPhase:'members', loadMsg:'กำลังโหลดข้อมูลสมาชิก…'});\n        this.loadData().then(ok=>{\n          if (!ok && !this._v3) {              // token หมดอายุจริง → กลับไปหน้าเข้าสู่ระบบ\n            const err = this.state.loadErr || '';\n            if (/เซสชัน|สิ้นสุด|สิทธิ์/.test(err)) {\n              this._token = null;\n              try { sessionStorage.removeItem('wr-token'); } catch(e){}\n              this.setState({ready:false, gate:true, gErr:'เซสชันสิ้นสุดแล้ว กรุณาเข้าสู่ระบบใหม่', loadErr:''});\n            }\n          }\n        });\n      }\n    }\n  }\n\n  loadImported(){\n    try {\n      const raw = localStorage.getItem('wr-imported');\n      if (!raw) return null;\n      const o = JSON.parse(raw);\n      if (o && o.services && o.people) return o;\n    } catch(e){}\n    return null;\n  }\n\n  finishLogin(role){\n    const imp = this.loadImported();\n    if (!window.WR && imp) { window.WR = {services:imp.services, people:imp.people}; this._cache = null; this._impAt = imp.at; }\n    this._skey = 'wr-overrides-' + role;\n    let saved = {};\n    if (role === 'admin') { try { saved = JSON.parse(localStorage.getItem(this._skey) || '{}') || {}; } catch(e){} }\n    // ของที่เคยเก็บไว้ด้วยกุญแจรุ่นเก่า 'K:1385' → แปลงเป็น '1385' ให้ตรงกับรูปแบบปัจจุบัน\n    saved = Object.keys(saved).reduce((acc, k)=>{ acc[k.indexOf('K:')===0 ? k.slice(2) : k] = saved[k]; return acc; }, {});\n    const baked = (window.WR_OVERRIDES && typeof window.WR_OVERRIDES === 'object') ? window.WR_OVERRIDES : {};\n    this._cache = null;\n    this.setState({ gate:false, gErr:'' });\n    this.setState({ role, ready:true, loggingIn:false, pw:'', loginError:'',\n      locked: role === 'viewer' || role === 'registrar', overrides:{...baked, ...saved},\n      pfUser: (this.loadAdminCfg()||{}).user || this._acct || 'Admin',\n      pfApiUrl: this.apiCfg().url });\n  }\n\n  logout(){ sessionStorage.removeItem('wr-session'); sessionStorage.removeItem('wr-who');\n    sessionStorage.removeItem('wr-token'); sessionStorage.removeItem('wr-role');\n    sessionStorage.removeItem('wr-acct'); location.reload(); }\n\n  // ── นำเข้าไฟล์จาก Google Sheet (CSV) ──\n  parseCSV(text){\n    const rows = []; let row = [], cell = '', q = false;\n    text = text.replace(/^\\ufeff/, '');\n    for (let i = 0; i < text.length; i++) {\n      const c = text[i];\n      if (q) {\n        if (c === '\"') { if (text[i+1] === '\"') { cell += '\"'; i++; } else q = false; }\n        else cell += c;\n      } else if (c === '\"') q = true;\n      else if (c === ',') { row.push(cell); cell = ''; }\n      else if (c === '\\n') { row.push(cell); rows.push(row); row = []; cell = ''; }\n      else if (c !== '\\r') cell += c;\n    }\n    if (cell || row.length) { row.push(cell); rows.push(row); }\n    return rows;\n  }\n\n  thToISO(s){\n    s = (s||'').trim();\n    let m = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);\n    if (m) return `${+m[1]-543}-${m[2]}-${m[3]}`;\n    m = s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})/);\n    if (m) { const y = +m[3] > 2200 ? +m[3]-543 : (+m[3] > 2400 ? +m[3]-543 : +m[3]); return `${+m[3]-543 > 1900 ? +m[3]-543 : +m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`; }\n    return null;\n  }\n\n  cleanCell(s){ return (s||'').replace(/[\\u200b\\u200c\\u200d]/g,'').replace(/\\s+/g,' ').trim(); }\n  nameKey(s){ return this.cleanCell(s).replace(/\\s+/g,'').toLowerCase(); }\n\n  // หาว่าคอลัมน์ไหนคืออะไร จากแถวหัวตาราง ถ้าไม่มีหัวตารางจะเดาจากข้อมูล\n  mapColumns(rows, kind){\n    const has = (c, ...kw) => kw.some(k=>this.cleanCell(c).includes(k));\n    let hi = -1, map = {};\n    for (let i = 0; i < Math.min(rows.length, 6); i++) {\n      const r = rows[i];\n      if (r.some(c=>has(c,'ชื่อ'))) { hi = i; break; }\n    }\n    if (hi >= 0) {\n      rows[hi].forEach((c,i)=>{\n        const t = this.cleanCell(c);\n        if (map.date == null && /ว\\/ด\\/ป|ประทับเวลา|เวลา|วันที่|timestamp/i.test(t)) map.date = i;\n        if (map.name == null && t.includes('ชื่อ') && !t.includes('ชื่อเล่น')) map.name = i;\n        if (map.nick == null && t.includes('ชื่อเล่น')) map.nick = i;\n        if (map.status == null && t.includes('สถานะ')) map.status = i;\n        if (map.group == null && t.includes('กลุ่ม')) map.group = i;\n        if (map.tel == null && /โทร|เบอร์/.test(t)) map.tel = i;\n        if (map.birth == null && t.includes('เกิด')) map.birth = i;\n        if (map.code == null && t.includes('รหัส')) map.code = i;\n        if (map.note == null && t.includes('หมายเหตุ')) map.note = i;\n      });\n    }\n    const body = rows.slice(hi >= 0 ? hi+1 : 0);\n    if (map.date == null) {           // เดาคอลัมน์วันที่ = คอลัมน์ที่แปลงเป็นวันที่ได้มากที่สุด\n      let best = -1, bestN = 0;\n      const width = Math.max(...body.slice(0,200).map(r=>r.length), 0);\n      for (let c = 0; c < width; c++) {\n        const n = body.slice(0,200).filter(r=>this.thToISO(r[c])).length;\n        if (n > bestN) { bestN = n; best = c; }\n      }\n      map.date = best < 0 ? 0 : best;\n    }\n    if (map.name == null) {           // เดาคอลัมน์ชื่อ = คอลัมน์ตัวอักษรที่มีค่าไม่ซ้ำมากที่สุด\n      let best = -1, bestN = 0;\n      const width = Math.max(...body.slice(0,200).map(r=>r.length), 0);\n      for (let c = 0; c < width; c++) {\n        if (c === map.date) continue;\n        const vals = body.slice(0,200).map(r=>this.cleanCell(r[c])).filter(v=>v && !/^\\d+$/.test(v) && !this.thToISO(v));\n        const n = new Set(vals).size;\n        if (n > bestN) { bestN = n; best = c; }\n      }\n      map.name = best < 0 ? (kind === 'att' ? 1 : 4) : best;\n    }\n    return {map, body};\n  }\n\n  savedParts(){\n    try { const o = JSON.parse(localStorage.getItem('wr-parts') || 'null'); if (o) return o; } catch(e){}\n    return {members:null, att:null};\n  }\n\n  async importFiles(fileList, roleOverride){\n    const files = [...fileList];\n    if (!files.length) return;\n    if (roleOverride) this._roleOverride = roleOverride;\n    this.setState({importMsg:'กำลังอ่านไฟล์…', importErr:''});\n    try {\n      const parts = this.savedParts();\n      for (const f of files) {\n        const text = await f.text();\n        const rows = this.parseCSV(text).filter(r=>r.some(c=>this.cleanCell(c)));\n        if (!rows.length) continue;\n        const fn = f.name.toLowerCase();\n        let kind = /member/.test(fn) ? 'members' : (/worship|register|นมัสการ/.test(fn) ? 'att' : null);\n        if (!kind) {\n          const probe = this.mapColumns(rows, 'att');\n          const withTime = probe.body.filter(r=>/\\d{1,2}:\\d{2}/.test(r[probe.map.date]||'')).length;\n          kind = withTime > probe.body.length/3 ? 'att' : 'members';\n        }\n        const {map, body} = this.mapColumns(rows, kind);\n        const good = body.filter(r=>this.thToISO(r[map.date]) && this.cleanCell(r[map.name]));\n        if (!good.length) throw new Error('อ่านไฟล์ ' + f.name + ' ไม่ได้ — ไม่พบคอลัมน์วันที่หรือชื่อ');\n        parts[kind] = {file:f.name, rows:good, map, n:good.length};\n      }\n      try { localStorage.setItem('wr-parts', JSON.stringify(parts)); } catch(e){}\n      this.setState({parts, importMsg:'', importErr:''});\n      if (parts.att && parts.members) this.applyParts(parts);\n      else this.setState({importMsg:'รับไฟล์แล้ว — เลือกอีกไฟล์ที่เหลือ แล้วกด “บันทึกและแสดงข้อมูล”'});\n    } catch(e){ this.setState({importMsg:'', importErr:'นำเข้าไม่สำเร็จ: '+e.message}); }\n  }\n\n  applyParts(parts){\n    parts = parts || this.savedParts();\n    if (!parts.att && !parts.members) { this.setState({importErr:'ยังไม่มีไฟล์ที่นำเข้า'}); return; }\n    const clean = s => this.cleanCell(s), key = s => this.nameKey(s);\n    const JUNK = new Set(['เลือกชื่อผู้เข้าร่วม','นมัสการ']);\n    const M = parts.members, A = parts.att;\n    const services = A ? [...new Set(A.rows.map(r=>this.thToISO(r[A.map.date])).filter(Boolean))].sort() : [];\n    const sidx = Object.fromEntries(services.map((d,i)=>[d,i]));\n    const mm = new Map();\n    if (M) for (const r of M.rows) {\n      const g = i => i == null ? '' : clean(r[i]);\n      const nm = clean(r[M.map.name]); if (!nm || JUNK.has(nm)) continue;\n      const k = key(nm), j = this.thToISO(r[M.map.date]) || '';\n      const prev = mm.get(k);\n      mm.set(k, {name: prev ? prev.name : nm, code:g(M.map.code), nick:g(M.map.nick) || (prev&&prev.nick) || '',\n        status:g(M.map.status), group:g(M.map.group), tel:g(M.map.tel), note:g(M.map.note),\n        birth: this.thToISO(M.map.birth == null ? '' : r[M.map.birth]) || (prev&&prev.birth) || '',\n        earliest: prev && prev.earliest && prev.earliest < j ? prev.earliest : j});\n    }\n    const att = new Map();\n    if (A) for (const r of A.rows) {\n      const g = i => i == null ? '' : clean(r[i]);\n      const nm = clean(r[A.map.name]); if (!nm || JUNK.has(nm)) continue;\n      const d = this.thToISO(r[A.map.date]); if (!d) continue;\n      const k = key(nm);\n      let a = att.get(k); if (!a) { a = {name:nm, dates:new Set(), status:g(A.map.status), group:g(A.map.group), note:g(A.map.note)}; att.set(k, a); }\n      a.dates.add(d);\n    }\n    const keys = [...new Set([...mm.keys(), ...att.keys()])];\n    const people = keys.map(k=>{\n      const m = mm.get(k), a = att.get(k);\n      const d = a ? [...a.dates].sort().map(x=>sidx[x]).filter(i=>i!=null) : [];\n      const join = m ? (m.earliest || '') : '';\n      const firstAtt = d.length ? services[d[0]] : '';\n      const sen = [join, firstAtt].filter(Boolean).sort()[0] || '';\n      return {n:(m&&m.name)||(a&&a.name)||k, k:(m&&m.nick)||'', s:(m&&m.status)||(a&&a.status)||'',\n        g:(m&&m.group)||(a&&a.group)||'', o:(m&&m.note)||(a&&a.note)||'', c:(m&&m.code)||'',\n        t:(m&&m.tel)||'', b:(m&&m.birth)||'', j:join, f:firstAtt, sen,\n        src: m&&a ? 'both' : (m ? 'member' : 'att'), d};\n    });\n    const records = people.reduce((s,p)=>s+p.d.length,0);\n    const codes = new Set(people.map(p=>p.c ? 'C:'+String(p.c).trim() : 'N:'+p.n));\n    const lost = Object.keys(this.state.overrides || {}).filter(k=>!codes.has(k));\n    window.WR = {services, people};\n    this._cache = null;\n    try { localStorage.setItem('wr-imported', JSON.stringify({at:new Date().toISOString().slice(0,10), services, people})); } catch(e){}\n    const msg = `บันทึกแล้ว · รายชื่อ ${people.length} คน · บันทึกนมัสการ ${records} รายการ / ${services.length} ครั้ง` +\n      (lost.length ? ` · ⚠ ${lost.length} รายชื่อที่เคยปรับสถานะไว้ไม่พบในไฟล์ใหม่` : '');\n    this.setState({importMsg:msg, importErr:''});\n    const role = this._roleOverride || this._serverRole || 'admin';\n    this._roleOverride = null;\n    if (!this.state.ready) this.finishLogin(role); else this.forceUpdate();\n  }\n\n  // เรียงคอลัมน์: กดครั้งที่ 1 = น้อย→มาก / ก→ฮ · ครั้งที่ 2 = มาก→น้อย · ครั้งที่ 3 = กลับค่าเริ่มต้น\n  toggleSort(key){\n    const {sortKey, sortDir} = this.state;\n    if (sortKey !== key) this.setState({sortKey:key, sortDir:1});\n    else if (sortDir === 1) this.setState({sortDir:-1});\n    else this.setState({sortKey:'', sortDir:1});\n  }\n\n  saveAdminCfg(){\n    const cfg = {user:this.state.pfUser};   // ไม่เก็บรหัสผ่านไว้ในเครื่อง\n    try { localStorage.setItem('wr-admin-cfg', JSON.stringify(cfg)); } catch(e){}\n  }\n  loadAdminCfg(){\n    try { const c = JSON.parse(localStorage.getItem('wr-admin-cfg') || 'null'); if (c) return c; } catch(e){}\n    return null;\n  }\n\n  // ── เชื่อมต่อ backend (Google Apps Script Web App) ──────────────\n  // เก็บเพียง URL ของ backend — ไม่มี API key หรือกุญแจถอดรหัสในไฟล์สาธารณะ\n  // ทุกคำสั่งต้องมี token ที่ออกหลังล็อกอินสำเร็จ และตรวจ Role ที่เซิร์ฟเวอร์\n  apiCfg(){\n    // ลำดับ: ค่าคงที่ของระบบ (production) → ค่าที่ฝังไว้ตอนสร้างไฟล์ → ค่าทดสอบในเครื่อง (เฉพาะโหมด debug)\n    const fixed = (window.WR_BACKEND || '').trim();\n    if (fixed) return { url: fixed, fixed: true };\n    const baked = (window.WR_API && window.WR_API.url) || '';\n    if (baked) return { url: baked, fixed: true };\n    let local = null;\n    try { local = JSON.parse(localStorage.getItem('wr-api') || 'null'); } catch(e){}\n    return { url: (local && local.url) || '', fixed: false };\n  }\n  hasApi(){ return !!this.apiCfg().url; }\n  // หน้าตั้งค่าเปิดได้เฉพาะตอนยังไม่มี URL ของระบบ และเปิด ?setup=1 เท่านั้น\n  setupMode(){\n    if (this.apiCfg().fixed) return false;\n    try { return new URLSearchParams(location.search).get('setup') === '1'; } catch(e){ return false; }\n  }\n\n  // ── ชนิดคำตอบที่ยอมรับได้ของแต่ละคำสั่ง ──\n  // backend ประทับ kind + forAction + reqId + via มากับทุกคำตอบ\n  // ถ้าไม่ตรงกับคำขอ ถือเป็น protocol error — ห้ามนำข้อมูลไปใช้เด็ดขาด\n  get FRONTEND_BUILD(){ return '2026-09-11-membership-v3'; }\n  get EXPECTED_BACKEND(){ return '2026-09-11-membership-v3'; }\n  get STATUS_DOC(){ return [\n    {h:'สมาชิกสมบูรณ์ 1', c:'#1f5b4e', p:[\n      'คือสมาชิกสมบูรณ์ที่ยังมีส่วนร่วมกับชีวิตของคริสตจักรตามปกติ ทั้งในการนมัสการ การถวาย การรับใช้ และการมีส่วนร่วมในพันธกิจหรือกิจกรรมของคริสตจักร',\n      'โดยทั่วไป สมาชิกสมบูรณ์ 1 ควรมีการเข้าร่วมนมัสการอย่างต่อเนื่อง มีส่วนในการถวายตามหลักสมาชิกภาพ และยังคงมีความสัมพันธ์กับคริสตจักรอย่างสม่ำเสมอ',\n      'สมาชิกสมบูรณ์ 1 เป็นสมาชิกที่มีสิทธิ์ตามสมาชิกภาพอย่างครบถ้วน รวมถึงสิทธิ์ในการออกเสียงลงคะแนน และสามารถได้รับการเสนอชื่อเพื่อดำรงตำแหน่ง รับหน้าที่ หรือรับใช้ตามระเบียบของคริสตจักร']},\n    {h:'สมาชิกสมบูรณ์ 1 · โดยมติธรรมกิจ', c:'#1f5b4e', p:[\n      'คือสมาชิกที่ตามเกณฑ์ปกติเข้าสู่สมาชิกสมบูรณ์ 2 เนื่องจากขาดการนมัสการต่อเนื่องครบ 1 ปี แต่เมื่อคณะธรรมกิจพิจารณาข้อมูลและสถานการณ์โดยรวมแล้ว เห็นว่ายังมีเหตุสมควรให้คงเป็นสมาชิกสมบูรณ์ 1',\n      'เหตุประกอบการพิจารณาอาจเป็น เช่น',\n      '• ยังมีการถวายหรือถวายสิบลดอย่างต่อเนื่อง',\n      '• ยังเข้าร่วมกิจกรรมหรือพันธกิจของคริสตจักร',\n      '• ยังมีส่วนในการรับใช้ในรูปแบบอื่น',\n      '• ยังติดต่อกับคริสตจักรและสามารถติดตามได้',\n      '• มีเหตุจำเป็น เช่น สุขภาพ การทำงาน การเดินทาง หรือการพำนักต่างพื้นที่',\n      '• หรือมีเหตุอื่นที่คณะธรรมกิจพิจารณาแล้วเห็นสมควร',\n      'บุคคลในกลุ่มนี้ยังคงมีสถานภาพและสิทธิ์เช่นเดียวกับสมาชิกสมบูรณ์ 1 แต่จะแสดงแยกไว้ให้เห็นชัดว่าเป็นการคงสถานภาพสมาชิกสมบูรณ์ 1 โดยมติของคณะธรรมกิจ',\n      'ควรมีการบันทึกวันที่พิจารณา เหตุผล และข้อมูลที่เกี่ยวข้องไว้ เพื่อให้สามารถติดตามภายหลังได้ว่า หลังจากมีมติแล้ว สมาชิกมีการนมัสการ การถวาย การร่วมกิจกรรม การรับใช้ หรือการติดต่อกับคริสตจักรเปลี่ยนแปลงไปอย่างไร']},\n    {h:'สมาชิกสมบูรณ์ 2', c:'#b5651d', p:[\n      'คือผู้ที่ยังคงเป็นสมาชิกสมบูรณ์ของคริสตจักร แต่ขาดการนมัสการต่อเนื่องครบ 1 ปี และไม่มีมติของคณะธรรมกิจให้คงไว้เป็นสมาชิกสมบูรณ์ 1',\n      'การจำกัดสิทธิ์ของสมาชิกสมบูรณ์ 2 มีเหตุผลจากการที่สมาชิกขาดการนมัสการหรือขาดการมีส่วนร่วมกับคริสตจักรเป็นเวลานาน จนอาจไม่ได้ติดตามหรือรับรู้บริบท ความเป็นไป และความเคลื่อนไหวของคริสตจักรอย่างต่อเนื่อง รวมถึงในบางกรณีอาจขาดการติดต่อกับคริสตจักรด้วย',\n      'ด้วยเหตุนี้ ในช่วงที่อยู่ในสถานะสมาชิกสมบูรณ์ 2 จึงไม่มีสิทธิ์ออกเสียงลงคะแนน และไม่มีสิทธิ์ได้รับการเสนอชื่อให้ดำรงตำแหน่งหรือรับหน้าที่ที่กำหนดไว้สำหรับสมาชิกสมบูรณ์ 1',\n      'อย่างไรก็ตาม สมาชิกสมบูรณ์ 2 ยังคงถือว่าเป็นสมาชิกสมบูรณ์ของคริสตจักร ไม่ได้หมายความว่าถูกตัดออกจากสมาชิกภาพ เพียงแต่มีข้อจำกัดบางประการในช่วงที่ขาดการมีส่วนร่วมกับคริสตจักร',\n      'เมื่อกลับมามีส่วนร่วมกับคริสตจักรและเข้าเงื่อนไขของสมาชิกสมบูรณ์ 1 อีกครั้ง ก็สามารถกลับเข้าสู่สถานะสมาชิกสมบูรณ์ 1 และได้รับสิทธิ์ดังกล่าวตามปกติ',\n      'หากขาดการนมัสการต่อเนื่องเป็นเวลานานถึงเกณฑ์ที่ต้องนำเข้าพิจารณา ระบบจะแจ้งให้คณะธรรมกิจนำกรณีนั้นมาพิจารณาตามระเบียบต่อไป โดยจะไม่เปลี่ยนไปเป็นสมาชิกสำรองหรือสถานภาพอื่นโดยอัตโนมัติหากยังไม่มีมติของคณะธรรมกิจ']},\n    {h:'สมาชิกสำรอง', c:'#7a6ca8', p:[\n      'คือผู้ที่มีสถานภาพเป็นสมาชิกสำรองตามทะเบียนของคริสตจักร',\n      'สมาชิกสำรองอาจประกอบด้วยเยาวชนหรือลูกหลานที่เติบโตอยู่ในคริสตจักร แต่ยังมีอายุหรือคุณสมบัติไม่ถึงเกณฑ์ที่จะเป็นสมาชิกสมบูรณ์',\n      'นอกจากนี้ สมาชิกสำรองอาจรวมถึงผู้ที่เคยเป็นสมาชิกสมบูรณ์ แต่ขาดคุณสมบัติหรือขาดการมีส่วนร่วมกับคริสตจักรต่อเนื่องเป็นเวลานาน และคณะธรรมกิจได้พิจารณาและมีมติให้กลับมาอยู่ในสถานภาพสมาชิกสำรองตามขั้นตอนและระเบียบที่เกี่ยวข้อง',\n      'ดังนั้น การเปลี่ยนจากสมาชิกสมบูรณ์มาเป็นสมาชิกสำรองจะไม่เกิดขึ้นโดยอัตโนมัติเพียงเพราะขาดการนมัสการ แต่ต้องผ่านการพิจารณาและมติของคณะธรรมกิจก่อน',\n      'สมาชิกสำรองยังคงเป็นส่วนหนึ่งของคริสตจักร และสามารถเข้าร่วมนมัสการ กิจกรรม พันธกิจ การรับใช้ และการถวายได้ตามปกติ แต่สิทธิ์บางประการจะแตกต่างจากสมาชิกสมบูรณ์ตามระเบียบสมาชิกภาพของคริสตจักร',\n      'เมื่อมีอายุและคุณสมบัติครบ มีความประสงค์จะเป็นสมาชิกสมบูรณ์ และถึงเวลาที่เหมาะสม สามารถเข้าสู่ขั้นตอน “รอพิจารณาเป็นสมาชิกสมบูรณ์” เพื่อให้คณะธรรมกิจพิจารณาต่อไป']},\n    {h:'ผู้ร่วมนมัสการ / ยังไม่ระบุสถานภาพ', c:'#8a8477', p:[\n      'คือผู้ที่เข้ามาร่วมนมัสการหรือมีส่วนกับคริสตจักร แต่ยังไม่ได้รับการรับรองเป็นสมาชิกสมบูรณ์ หรือข้อมูลในทะเบียนยังไม่ได้ระบุสถานภาพสมาชิกอย่างชัดเจน',\n      'การมาร่วมนมัสการเป็นเวลานานไม่ได้ทำให้บุคคลนั้นเป็นสมาชิกสมบูรณ์โดยอัตโนมัติ',\n      'ผู้ที่ประสงค์จะเป็นสมาชิกสมบูรณ์ต้องแจ้งความประสงค์ และผ่านระยะเวลาการร่วมนมัสการตามหลักเกณฑ์ที่กำหนด',\n      'หากมาจากคริสตจักรที่อยู่ในสังกัดของสภา ต้องร่วมนมัสการกับคริสตจักรอย่างน้อย 1 ปี',\n      'หากมาจากคริสตจักรที่อยู่นอกสังกัดของสภา ต้องร่วมนมัสการกับคริสตจักรอย่างน้อย 2 ปี',\n      'เมื่อครบระยะเวลาตามเกณฑ์แล้ว บุคคลนั้นยังไม่เป็นสมาชิกสมบูรณ์โดยอัตโนมัติ แต่จะเข้าสู่กลุ่ม “รอพิจารณาเป็นสมาชิกสมบูรณ์”',\n      'คณะธรรมกิจจะพิจารณาความพร้อมของแต่ละบุคคล เช่น อายุ ความประสงค์ในการเป็นสมาชิก การนมัสการ การมีส่วนร่วมกับคริสตจักร และคุณสมบัติอื่นตามระเบียบ',\n      'เมื่อคณะธรรมกิจพิจารณาและรับรองแล้ว จึงจะได้รับสถานภาพเป็นสมาชิกสมบูรณ์ 1']},\n    {h:'รอพิจารณาเป็นสมาชิกสมบูรณ์', c:'#5b3f7a', p:[\n      'คือผู้ที่ผ่านระยะเวลาการร่วมนมัสการตามหลักเกณฑ์แล้ว แต่ยังไม่ได้รับการรับรองให้เป็นสมาชิกสมบูรณ์',\n      'การอยู่ในกลุ่มนี้ไม่ได้หมายความว่าบุคคลนั้นมีคุณสมบัติครบโดยอัตโนมัติ แต่เป็นการแจ้งว่าถึงเวลาที่คณะธรรมกิจสามารถนำบุคคลนั้นมาพิจารณาได้',\n      'บางคนอาจยังไม่ถึงเกณฑ์อายุ บางคนอาจยังไม่ประสงค์เป็นสมาชิกสมบูรณ์ หรืออาจมีเหตุผลอื่นที่ควรพิจารณาเพิ่มเติม',\n      'บุคคลนั้นจะได้รับสถานภาพสมาชิกสมบูรณ์ 1 เมื่อคณะธรรมกิจได้พิจารณาและรับรองแล้วเท่านั้น']},\n    {h:'หลักในการพิจารณาร่วมกัน', c:'#191817', p:[\n      'การพิจารณาสมาชิกไม่ได้ดูเฉพาะจำนวนครั้งของการมานมัสการเพียงอย่างเดียว แต่ให้พิจารณาภาพรวมของการดำเนินชีวิตและความสัมพันธ์กับคริสตจักร ได้แก่ การนมัสการ การถวาย การร่วมกิจกรรมหรือพันธกิจ การรับใช้ การติดต่อสัมพันธ์กับคริสตจักร ตลอดจนเหตุจำเป็นหรือสถานการณ์เฉพาะของแต่ละบุคคล',\n      'ระบบมีหน้าที่ช่วยรวบรวมและแสดงข้อมูลตามหลักเกณฑ์เดียวกัน เพื่อให้เกิดความชัดเจนและเป็นธรรม',\n      'ส่วนกรณีที่ต้องใช้ดุลพินิจหรือมีข้อยกเว้น ให้เป็นการพิจารณาโดยคณะธรรมกิจ และควรมีการบันทึกวันที่ เหตุผล และมติไว้ เพื่อให้สามารถติดตามและตรวจสอบย้อนหลังได้']},\n  ]; }\n  get BOARD_REASONS(){ return ['ยังมีการถวายหรือถวายสิบลดต่อเนื่อง','ยังร่วมกิจกรรมหรือพันธกิจ',\n    'ยังมีส่วนในการรับใช้','ยังติดต่อกับคริสตจักร','สุขภาพ','การทำงาน','การเดินทาง/พำนักต่างพื้นที่','อื่น ๆ']; }\n  get PENDING_REASONS(){ return ['อายุยังไม่ถึงเกณฑ์','ยังไม่ประสงค์เป็นสมาชิก',\n    'คุณสมบัติยังไม่ครบ','รอติดตามเพิ่มเติม','อื่น ๆ']; }\n  get DECISION_LABEL(){ return {full1:'สมาชิกสมบูรณ์ 1 · โดยมติธรรมกิจ',\n    full1plain:'สมาชิกสมบูรณ์ ประเภท 1 · สิทธิ์ครบ', full2:'สมาชิกสมบูรณ์ 2',\n    spare:'สมาชิกสำรอง', attender:'ผู้ร่วมนมัสการ / ยังไม่ระบุ', pending:'คงไว้รอพิจารณา',\n    resigned:'ลาออก', transferred:'ย้ายสังกัด', expelled:'ให้ออกโดยมติธรรมกิจ', deceased:'เสียชีวิต'}; }\n  get ROLE_LABEL(){ return {admin:'ผู้ดูแล', editor:'ผู้แก้ไข',\n    viewer:'ธรรมกิจ (ดูอย่างเดียว)', registrar:'ฝ่ายทะเบียน (ดูเฉพาะประเภทสมาชิก)'}; }\n  // สัญญาเดียวของระบบ: kind ของคำตอบต้องเท่ากับ action ที่ขอเสมอ (backend บังคับทับด้วย stamp_)\n  // ประกาศไว้ชัดเจนเพื่อให้ตรวจสอบได้ — ค่าเริ่มต้นคือชื่อ action เอง\n  get E ,\n          kind:j.kind, forAction:j.forAction, via:j.via, rid:j.reqId, backendBuild:j.backendBuild,\n          redirected:res.redirected});\n        // ── ตรวจซองก่อนใช้ข้อมูล ── ป้องกันคำตอบสลับคำสั่ง (เช่น ขอ attendance แต่ได้ ping)\n        // สาเหตุที่พบจริง: POST ถูกเปลี่ยนเป็น GET ระหว่าง redirect → doGet ตอบ ping กลับมา\n        const hasEnvelope = !!(j.backendBuild && j.via && j.forAction && j.kind && j.reqId);\n        if (!hasEnvelope) {\n          if (!this.LEGACY_OK) {\n            this.logDiag({command:action, reqId, status:res.status, ms:ms0, base:maskUrl,\n              kind:j.kind, forAction:j.forAction, via:j.via, note:'NO ENVELOPE — discarded'});\n            return {ok:false, errType:'protocolVersion',\n              error:'ฐานข้อมูลกลางกำลังอัปเดตหรือยังเป็นรุ่นเก่า — ถ้าเพิ่ง Deploy กรุณารอสักครู่แล้วกด “ลองโหลดอีกครั้ง” · ถ้ายังไม่หาย ต้อง Deploy Code.gs รุ่นใหม่เป็น New version'};\n          }\n        } else {\n          const badVia = j.via !== 'POST';\n          const badAction = j.forAction !== action;\n          const badKind = j.ok !== false && j.kind !== this.expectKind(action);\n          const badReq = reqId && j.reqId !== reqId;\n          if (badVia || badAction || badKind) {\n            this.logDiag({command:action, reqId, status:res.status, ms:ms0, base:maskUrl,\n              kind:j.kind, forAction:j.forAction, via:j.via, note:'WRONG KIND — discarded'});\n            return {ok:false, errType:'wrongKind',\n              error:'ได้รับข้อมูลตอบกลับผิดประเภท (ขอ '+action+'/'+this.expectKind(action)+\n                    ' แต่ได้ '+(j.forAction||'?')+'/'+(j.kind||'?')+\n                    (badVia ? ' ผ่าน '+j.via : '')+') ระบบไม่ได้ใช้ข้อมูลชุดนี้'};\n          }\n          if (j.backendBuild !== this.EXPECTED_BACKEND) {\n            this.logDiag({command:action, reqId, status:res.status, ms:ms0, base:maskUrl,\n              kind:j.kind, note:'BUILD MISMATCH ' + j.backendBuild});\n            return {ok:false, errType:'protocolVe   const noteOf = r => {\n      if (byDecision(r)) {\n        const d = r.decRec || {};\n        const bits = ['ผลตามเกณฑ์ระบบ: ' + LABEL[r.baseTier], 'ผลที่ใช้จริง: สมาชิกสมบูรณ์ 1 (โดยมติธรรมกิจ) · สิทธิ์ครบทุกประการ'];\n        if (d.decisionDate) bits.push('วันที่มีมติ ' + this.th(d.decisionDate));\n        if (d.reasons) bits.push('เหตุผล: ' + d.reasons.split(' | ').join(', '));\n        if (d.note) bits.push('หมายเหตุ: ' + d.note);\n        if (d.recordedBy) bits.push('ผู้บันทึก: ' + d.recordedBy);\n        if (d.decisionDate) {\n          const after = (r.visitDates || []).filter(v=>this.ms(v) > this.ms(d.decisionDate));\n          bits.push(after.length\n            ? 'หลังมติ: นมัสการ ' + after.length + ' ครั้ง · ล่าสุด ' + this.th(after[after.length-1])\n            : 'หลังมติ: ยังไม่มีบันทึกการลงชื่อนมัสการ (ระบบไม่มีข้อมูลการถวาย/กิจกรรมจึงไม่แสดง)');\n          const mo = Math.floor((nowMs - this.ms(d.decisionDate)) / (30.44*86400000));\n          bits.push('ผ่านมาแล้ว ' + mo + ' เดือนนับจากวันมีมติ');\n        }\n        if (d.nextReviewDate) bits.push('ทบทวนครั้งถัดไป ' + this.th(d.nextReviewDate)\n          + (this.ms(d.nextReviewDate) <= nowMs ? ' — ถึงกำหนดทบทวนแล้ว' : ' — ยังไม่ถึงกำหนด'));\n        return bits.join(' · ');\n      }\n      if (pendingState(r) === 'pending') {\n        const m = r.metaRec || {};\n        return 'ครบระยะเวลาร่วมนมัสการตามเกณฑ์ (' + (m.originType === 'COUNCIL' ? 'ในสังกัดสภา 1 ปี' : 'นอกสังกัดสภา 2 ปี')\n          + ') และแจ้งความประสงค์แล้ว — รอคณะธรรมกิจพิจารณารับรอง ยังไม่เป็นสมาชิกสมบูรณ์จนกว่าจะมีมติ';\n      }\n      if (pendingState(r) === 'incomplete')\n        return 'ข้อมูลสำหรับพิจารณายังไม่ครบ — ต้องระบุสังกัดเดิมและความประสงค์เป็นสมาชิกก่อน จึงจะประเมินเกณฑ์เวลาได้';\n      if (pendingState(r) === 'waiting') {\n        const m = r.metaRec || {};\n        const need = m.originType === 'COUNCIL' ? 1 : 2;\n        return 'แจ้งความประสงค์แล้ว · ร่วมนมัสการมา ' + tenureYears(r).toFixed(1) + ' ปี จากเกณฑ์ ' + need + ' ปี — ยังไม่เข้าคิวพิจารณา';\n      }\n      if (r.over) return 'กำหนดโดยมติธรรมกิจ';\n      if (r.tier===1) return idleText(r) + ' · ขาดครบ 1 ปี → สมาชิกสมบูรณ์ ประเภท 2 · ไม่มีสิทธิ์ออกเสียงลงคะแนนหรือถูกเสนอชื่อ สิทธิ์อื่นคงเดิม (ข้อ 93.4(4))';\n      if (r.tier===2) return idleText(r) + ' · สมาชิกสมบูรณ์ ประเภท 2 ที่ขาดต่อเนื่องจนถึงสามปี → เข้าเกณฑ์ควรนำเข้าพิจารณาให้คงสถานภาพเป็นสมาชิกสำรอง (ข้อ 93.4(4)) — สถานภาพเปลี่ยนเมื่อมีมติแล้วเท่านั้น';\n      if (r.tier===4) return idleText(r) + ' · เข้าเกณฑ์ติดตาม/ตักเตือนตามระเบียบ (ข้อ 94.6(4))';\n      if (r.tier===5) return idleText(r) + ' · เข้าเกณฑ์ควรนำเข้าพิจารณาตามระเบียบ: ขาดต่อเนื่องจนถึงสามปี (ข้อ 94.6(4)) — สถานภาพเปลี่ยนเมื่อมีมติแล้วเท่านั้น';\n      if (r.unknownStatus) return 'ยังไม่ระบุสถานภาพในทะเบียน — ต้องตรวจสอบ' + (r.visits ? '' : ' · ไม่มีบันทึกลงชื่อนมัสการ');\n      if (!r.visits) return 'ไม่มีบันทึกลงชื่อนมัสการ' + (r.status ? ' · ทะเบียนระบุ '+r.status.replace(/\\s+/g,' ') : '');\n      if (r.tier>=7) return r.status ? 'ทะเบียนระบุ '+r.status.replace(/\\s+/g,' ') : '';\n      return '';\n    };\n    const cnt = t => rows.filter(r=>r.tier===t).length;\n    // สมาชิกสมบูรณ์ที่ยังไม่ถึงเกณฑ์ 1 ปี แต่ขาดนมัสการตั้งแต่ 6 เดือนขึ้นไป → ควรติดตามล่วงหน้า\n    const warn6Count = rows.filter(isFollow6).length;\n    return {\n      ...base,\n      filters: (this.state.role === 'registrar'\n        ? makeFilters({ bands: [],\n            regFull1: rows.filter(r=>r.tier===0).length,\n            regFull2: rows.filter(r=>r.tier===1 || r.tier===2).length,\n            regOther: rows.filter(r=>r.tier>=3).length })\n            .filter(f=>REGISTRAR_KEYS.indexOf(f.key) >= 0)\n        : makeFilters({ all: rows.length, complete: rows.filter(r=>r.tier<=2).length,\n        // คนที่คงสิทธิ์โดยมติธรรมกิจ นับรวมใน“สมบูรณ์ ประเภท 1”ด้วย เพราะมีสิทธิ์เท่ากัน\n        // และยังแสดงแยกอีกการ์ดหนึ่งเพื่อให้เห็นว่าคงไว้โดยมติ\n        ok: rows.filter(r=>r.tier===0).length,\n        full1dec: rows.filter(byDecision).length,\n        warn6: warn6Count, warn: cnt(1), demoted: cnt(2), spare: cnt(3),\n        sparewarn: cnt(4), sparelost: cnt(5), attender: cnt(6),\n        pending: rows.filter(isPending).length,\n        resigned: cnt(7), transferred: cnt(8), expelled: cnt(9), deceased: cnt(10),\n        active: rows.filter(r=>r.cont >= 0.5).length,\n        bands: [1,2,3,4].map(b=>({ key:'band'+b, color:BAND_COLOR[b],\n          label: b>=4 ? 'ขาดเกิน 4 ปี' : 'ขาดเกิน '+b+' ปี',\n          n: rows.filter(r=>(r.tier===1||r.tier===2||r.tier===4||r.tier===5) && bandOf(r)===b).length })) })),\n      rangeText: `${this.th(svc[0])} – ${this.th(svc[svc.length-1])}`,\n      serviceCount: svc.length,\n      totalPeople: rows.length,\n      memberCount: rows.filter(r=>r.src!=='att').length,\n      qualifiedCount: cnt(0),\n      absentCount: cnt(1),\n      incompleteCount: cnt(2),\n      pendingCount: cnt(6),\n      returnedCount: 0,\n      resignedCount: cnt(7),\n      removedCount: cnt(9),\n      deceasedCount: cnt(10),\n      spareCount: cnt(3) + cnt(4),\n      completeTotal: rows.filter(r=>r.tier<=1).length,\n      bandStats: [1,2,3,4].map(b=>({\n        label: BAND_LABEL(b).replace('ขาดการนมัสการ',''),\n        count: rows.filter(r=>(r.tier===1||r.tier===2||r.tier===4||r.tier===5) && bandOf(r)===b).length,\n        onClick: ()=>this.setState({filter:'band'+b}),\n        style: `flex:1 1 130px;min-width:0;padding:10px 12px;text-align:left;background:#fffefb;border:1px solid #e3ded2;border-left:4px solid ${BAND_COLOR[b]};font-family:inherit;cursor:pointer`,\n        labelStyle: `font-size:11.5px;color:${BAND_COLOR[b]};font-weight:600`,\n        countStyle: `font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:#191817;margin-top:2px`,\n      })).filter(x=>x.count>0),\n      cutoffText: this.th(cutoffISO),\n      shownCount: shown.length,\n      recordCount: rows.reduce((a,r)=>a+r.visits,0),\n      groupOptions: [{value:'',label:'ทุกกลุ่ม'}, ...groups.map(g=>({value:g,label:g}))],\n      tierOptions: [\n        {value:'all', label:'ทุกคุณสมบัติ ('+rows.length+')'},\n        {value:'complete', label:'สมาชิกสมบูรณ์ทั้งหมด ประเภท 1 + 2 ('+rows.filter(r=>r.tier<=2).length+')'},\n        {value:'ok', label:'สมาชิกสมบูรณ์ ประเภท 1 · สิทธิ์ครบทุกประการ ('+rows.filter(r=>r.tier===0).length+')'},\n        {value:'full1dec', label:'สมาชิกสมบูรณ์ 1 · โดยมติธรรมกิจ ('+rows.filter(byDecision).length+')'},\n        {value:'pending', label:'รอพิจารณาเป็นสมาชิกสมบูรณ์ ('+rows.filter(isPending).length+')'},\n        {value:'warn6', label:'ควรติดตาม — ขาดนมัสการ 6 เดือน แต่ยังไม่ถึง 1 ปี ('+warn6Count+')'},\n        {value:'warn', label:'สมาชิกสมบูรณ์ ประเภท 2 · ขาดครบ 1 ปี ไม่มีสิทธิ์ออกเสียง/ถูกเสนอชื่อ ('+cnt(1)+')'},\n        {value:'demoted', label:'สมาชิกสมบูรณ์ ประเภท 2 · ขาดถึง 3 ปี ควรนำเข้าพิจารณาเป็นสำรอง ('+cnt(2)+')'},\n        ...[1,2,3,4].map(b=>({b, n:rows.filter(r=>(r.tier===1||r.tier===2||r.tier===4||r.tier===5) && bandOf(r)===b).length}))\n          .filter(x=>x.n>0)\n          .map(x=>({value:'band'+x.b, label:'  ↳ '+BAND_LABEL(x.b)+' ('+x.n+')'})),\n        {value:'spare', label:'สมาชิกสำรอง ('+cnt(3)+')'},\n        {value:'sparewarn', label:'สมาชิกสำรอง · เข้าเกณฑ์ติดตาม/ตักเตือน ('+cnt(4)+')'},\n        {value:'sparelost', label:'สมาชิกสำรอง · เข้าเกณฑ์ควรนำเข้าพิจารณา ('+cnt(5)+')'},\n        {value:'attender', label:'ผู้ร่วมนมัสการ / ยังไม่ระบุสถานภาพในทะเบียน ('+cnt(6)+')'},\n        {value:'resigned', label:'ลาออก ('+cnt(7)+')'},\n        {value:'transferred', label:'ย้ายสังกัด ('+cnt(8)+')'},\n        {value:'expelled', label:'ให้ออกโดยมติธรรมกิจ ('+cnt(9)+')'},\n        {value:'deceased', label:'เสียชีวิต ('+cnt(10)+')'},\n        {value:'active', label:'เข้าเกณฑ์เข้มแข็ง · ความต่อเนื่อง 50% ขึ้นไป ('+rows.filter(r=>r.cont >= 0.5).length+')'},\n        {value:'novisit', label:'ไม่มีบันทึกนมัสการ ('+rows.filter(r=>!r.visits).length+')'},\n      ],\n      selectionText: (() => {\n        const t = {all:'ทุกคุณสมบัติ', complete:'สมาชิกสมบูรณ์ทั้งหมด (ประเภท 1 + 2)', ok:'สมาชิกสมบูรณ์ ประเภท 1', full1dec:'สมาชิกสมบูรณ์ 1 · โดยมติธรรมกิจ (ตามเกณฑ์ระบบเป็นประเภท 2)', warn6:'ควรติดตาม — ขาดนมัสการ 6 เดือน แต่ยังไม่ถึง 1 ปี (ธงเตือนล่วงหน้า ไม่ใช่สถานะทะเบียน)', warn:'สมาชิกสมบูรณ์ ประเภท 2 (ขาดครบ 1 ปี · ไม่มีสิทธิ์ออกเสียง/ถูกเสนอชื่อ)', demoted:'สมาชิกสมบูรณ์ ประเภท 2 · ควรนำเข้าพิจารณาเป็นสำรอง (ขาดถึง 3 ปี)', spare:'สมาชิกสำรอง', sparewarn:'สมาชิกสำรอง · เข้าเกณฑ์ติดตาม/ตักเตือน', sparelost:'สมาชิกสำรอง · เข้าเกณฑ์ควรนำเข้าพิจารณา', attender:'ผู้ร่วมนมัสการ / ยังไม่ระบุสถานภาพในทะเบียน', resigned:'ลาออก', transferred:'ย้ายสังกัด', expelled:'ให้ออกโดยมติธรรมกิจ', deceased:'เสียชีวิต', active:'เข้าเกณฑ์เข้มแข็ง (ความต่อเนื่อง 50% ขึ้นไป)', novisit:'ไม่มีบันทึกนมัสการ'}[this.state.filter] || 'ทุกคุณสมบัติ';\n        const f = this.state.filter;\n        const label = f.startsWith('band') ? ('สมาชิกสมบูรณ์ · ' + BAND_LABEL(+f.slice(4))) : t;\n        return label + ' · ' + (this.state.group || 'ทุกกลุ่ม');\n      })(),\n      printLine2: (()=>{\n        const t = {all:'ทุกคุณสมบัติ', complete:'สมาชิกสมบูรณ์ทั้งหมด (ประเภท 1 + 2)', ok:'สมาชิกสมบูรณ์ ประเภท 1', full1dec:'สมาชิกสมบูรณ์ 1 · โดยมติธรรมกิจ', warn6:'ควรติดตาม — ขาดนมัสการ 6 เดือน แต่ยังไม่ถึง 1 ปี', warn:'สมาชิกสมบูรณ์ ประเภท 2', demoted:'สมาชิกสมบูรณ์ ประเภท 2 · ควรนำเข้าพิจารณาเป็นสำรอง', spare:'สมาชิกสำรอง', sparewarn:'สมาชิกสำรอง · เข้าเกณฑ์ติดตาม', sparelost:'สมาชิกสำรอง · เข้าเกณฑ์ควรนำเข้าพิจารณา', attender:'ผู้ร่วมนมัสการ / ยังไม่ระบุสถานภาพ', resigned:'ลาออก', transferred:'ย้ายสังกัด', expelled:'ให้ออกโดยมติธรรมกิจ', deceased:'เสียชีวิต', active:'เข้าเกณฑ์เข้มแข็ง (ความต่อเนื่อง 50% ขึ้นไป)', novisit:'ไม่มีบันทึกนมัสการ'}[this.state.filter];\n        const f = this.state.filter;\n        const label = f.startsWith('band') ? ('สมาชิกสมบูรณ์ · ' + BAND_LABEL(+f.slice(4))) : (t || 'ทุกคุณสมบัติ');\n        return 'กลุ่มที่แสดง: ' + label + ' · ' + (this.state.group || 'ทุกกลุ่ม') + ' · รวม ' + shown.length + ' รายชื่อ';\n      })(),\n      rows: shown.map(r=>({\n        rank: rank.get(r),\n        name: r.name,\n        meta: [r.code && '#'+r.code, r.nick, r.ageY != null && r.ageY < 120 ? 'อายุ '+r.ageY+' ปี' : '', r.group, r.status].filter(Boolean).join(' · '),\n        badge: labelOf(r),\n        canEdit: this.state.role === 'admin',\n        onEdit: ()=>this.openEditor(r),\n        badgeStyle: badgeStyle(r),\n        caret: this.state.locked ? '' : '▾',\n        onBadge: this.state.locked ? undefined : (e)=>{ e.stopPropagation(); this.setState({menuFor: this.state.menuFor===r.name ? null : r.name}); },\n        menuOpen: !this.state.locked && this.state.menuFor === r.name,\n        menuItems: [\n          {key:'', label:'ตามการคำนวณ (' + LABEL[r.baseTier] + ')', color:'#1f5b4e'},\n          {key:'full1plain', label:'สมบูรณ์ ประเภท 1 · สิทธิ์ครบ', color:'#1f5b4e'},\n          {key:'full1', label:'สมบูรณ์ 1 · โดยมติธรรมกิจ', color:'#2f7a5c'},\n          {key:'full2', label:'สมบูรณ์ ประเภท 2 · งดสิทธิ์ออกเสียง / ถูกเสนอชื่อ', color:'#b5651d'},\n          {key:'spare', label:'สมาชิกสำรอง / ขาดนมัสการเกิน 3 ปี', color:'#7a6ca8'},\n          {key:'attender', label:'ผู้ร่วมนมัสการ / ยังไม่ระบุ', color:'#8a8477'},\n          {key:'pending', label:'คงไว้รอพิจารณา', color:'#5b3f7a'},\n          {key:'resigned', label:'ลาออก', color:'#9a7b3f'},\n          {key:'transferred', label:'ย้ายสังกัด', color:'#3f6b8a'},\n          {key:'expelled', label:'ให้ออกโดยมติธรรมกิจ', color:'#8c2f2f'},\n          {key:'deceased', label:'เสียชีวิต', color:'#4a4a4a'},\n        ].map((m,i)=>{\n          const on = (r.over||'') === m.key;\n          // มติที่ต้องบันทึกรายละเอียด (คงเป็นสมบูรณ์ 1 / คงไว้รอพิจารณา) เปิดฟอร์มก่อนบันทึก\n          const needsForm = m.key === 'full1' || m.key === 'pending';\n          return {label:m.label, onClick:(e)=>{ e.stopPropagation();\n              this.setState({menuFor:null});\n              if (!needsForm) { this.setOverride(r, m.key||null); return; }\n              const ex = r.decRec || {};\n              this.setState({decOpen:true, decRow:r, decVal:m.key,\n                decSystem: LABEL[r.baseTier],\n                decDate: ex.decisionDate || new Date().toISOString().slice(0,10),\n                decReasons: ex.reasons ? ex.reasons.split(' | ') : [],\n                decNote: ex.note || '', decReview: ex.nextReviewDate || ''});\n            },\n            style:`display:block;width:100%;text-align:left;padding:8px 12px;border:none;${i?'border-top:1px solid #eee9dd;':''}background:${on?'#f3f1ea':'#fff'};font-family:inherit;font-size:12.5px;color:${m.color};font-weight:${on?600:400};cursor:pointer;white-space:nowrap`};\n        }),\n        // ธงเตือนล่วงหน้า — ขึ้นเฉพาะคนที่ยังไม่ถึงจุดเปลี่ยน 1 ปี/3 ปี\n        // ถ้าถึงแล้ว ป้ายหลักบอกอยู่แล้วว่าเป็นประเภท 2 หรือควรนำเข้าพิจารณา ธงจะซ้ำซ้อน\n        follow6: isFollow6(r),\n        follow6Style: 'display:inline-flex;align-items:center;margin-left:6px;padding:2px 7px;font-size:10.5px;font-weight:600;border-radius:2px;background:#f5efe0;color:#6e5316;border:1px solid #ddcfa8;white-space:nowrap',\n        flag: noteOf(r),\n        flagColor: (r.tier===1 || r.tier===2 || r.tier===4 || r.tier===5) ? BAND_COLOR[bandOf(r)] : '#7a7466',\n        flagWeight: (r.tier>=1 && r.tier<=5) ? 600 : 400,\n        join: this.th(r.sen),\n        first: this.th(r.firstAtt),\n        last: r.visits ? this.th(r.last) : '—',\n        lastColor: r.gap > 26 ? '#9a4a25' : '#191817',\n        tenure: r.sen ? r.tenureY.toFixed(1)+' ปี' : '—',\n        visits: r.visits,\n        recent: r.recent + '/52',\n        contText: Math.round(r.cont*100)+'%',\n        barStyle: `position:absolute;inset:0 auto 0 0;width:${Math.round(r.cont*100)}%;background:${BAR[r.tier]}`,\n        rowStyle: `border-bottom:1px solid #eee9dd;background:${r.tier===0?'#fffefb':'#fbfaf6'}`,\n        cardStyle: `padding:13px 14px;background:${r.tier===0?'#fffefb':'#fbfaf6'};border:1px solid #e3ded2;border-left:4px solid ${BAR[r.tier]};border-radius:2px`,\n        cells: [\n          {k:'เข้าเป็นสมาชิก', v:this.th(r.sen)},\n          {k:'นมัสการครั้งแรก', v:this.th(r.firstAtt)},\n          {k:'อายุสมาชิก', v:r.sen ? r.tenureY.toFixed(1)+' ปี' : '—'},\n          {k:'รวม', v:String(r.visits)},\n          {k:'12 ด.', v:r.recent + '/52'},\n          {k:'มาล่าสุด', v:r.visits ? this.th(r.last) : '—'},\n        ],\n      })),\n      narrow: !!this.state.narrow,\n      tableWrapStyle: this.state.narrow ? 'display:none' : 'overflow-x:auto',\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
