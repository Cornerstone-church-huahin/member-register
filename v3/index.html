document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

xt-shadow:none !important; }\n  }\n@keyframes wr-spin { to { transform: rotate(360deg); } }\n<\u002Fstyle>\n\n<sc-if value=\"{{ edOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:88;background:rgba(25,24,23,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto\">\n    <div style=\"width:100%;max-width:560px;background:#fffefb;border:1px solid #d9e3df;box-shadow:0 20px 60px -30px rgba(25,24,23,.7)\">\n      <div style=\"padding:18px 20px 14px;border-bottom:1px solid #eee9dd\">\n        <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:#1f5b4e\">จัดการข้อมูล<\u002Fdiv>\n        <h2 style=\"margin:6px 0 0;font-size:18px;font-weight:700;line-height:1.4\">{{ edName }}<\u002Fh2>\n        <div style=\"display:flex;gap:8px;margin-top:12px\">\n          <button sc-camel-on-click=\"{{ edOnMember }}\" style=\"{{ edTabMemberStyle }}\">ทะเบียนสมาชิก<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ edOnAtt }}\" style=\"{{ edTabAttStyle }}\">ประวัติการนมัสการ<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showMemberTab }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:16px 20px\">\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <sc-for list=\"{{ edRows }}\" as=\"fd\" hint-placeholder-count=\"6\">\n              <label style=\"display:flex;flex-direction:column;gap:4px\">\n                <span style=\"font-size:12px;color:#7a7466\">{{ fd.label }} <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#b8b0a0\">{{ fd.sheetCol }}<\u002Fspan><\u002Fspan>\n                <input value=\"{{ fd.value }}\" sc-camel-on-input=\"{{ fd.onInput }}\" style=\"padding:10px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px;outline:none\">\n              <\u002Flabel>\n 2Fdiv>\n          <button sc-camel-on-click=\"{{ onSaveMember }}\" style=\"display:block;width:100%;margin-top:12px;padding:13px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:15px;font-weight:600;border-radius:2px;cursor:pointer\">บันทึกลงทะเบียนกลาง<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showAttTab }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:16px 20px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px;background:#f6f8f7;border:1px solid #d9e3df\">\n            <label style=\"flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-size:12px;color:#41544d\">เพิ่มวันที่มานมัสการ<\u002Fspan>\n              <input type=\"date\" value=\"{{ edNewDate }}\" sc-camel-on-input=\"{{ onEdNewDate }}\" style=\"padding:10px 11px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px;outline:none\">\n            <\u002Flabel>\n            <button sc-camel-on-click=\"{{ onAddAtt }}\" style=\"padding:11px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:14px;font-weight:600;border-radius:2px;cursor:pointer\">เพิ่มรายการ<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#7a7466;margin:12px 0 8px\">บันทึกที่มีอยู่ · {{ edAttCount }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto\">\n            <sc-for list=\"{{ edAttRows }}\" as=\"ar\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:8px;align-items:center;padding:8px 11px;border:1px solid #e3ded2;background:#faf8f3\">\n                <span style=\"flex:1 1 auto;min-width:0;font-size:13px;font-family:'IBM Plex Mono',monospace\">{{ ar.when }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ ar.onDel }}\" style=\    <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:7px;text-align:left\">\n        <sc-for list=\"{{ loadSteps }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"{{ s.style }}\"><span style=\"width:14px;display:inline-block;text-align:center\">{{ s.mark }}<\u002Fspan><span>{{ s.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:16px;font-size:12px;color:#1f5b4e;line-height:1.6\">{{ loadMsg }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ credOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:90;background:rgba(25,24,23,.55);display:flex;align-items:center;justify-content:center;padding:20px 16px\">\n    <div style=\"width:100%;max-width:460px;background:#fffefb;border:1px solid #d9e3df;box-shadow:0 20px 60px -30px rgba(25,24,23,.7);padding:24px 22px 20px\">\n      <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:#1f5b4e\">สร้างบัญชีสำเร็จ<\u002Fdiv>\n      <h2 style=\"margin:8px 0 0;font-size:18px;font-weight:700;line-height:1.4\">ส่งข้อมูลเข้าใช้งานให้ผู้ใช้<\u002Fh2>\n      <div style=\"margin-top:5px;font-size:12px;color:#8c2f2f;line-height:1.75\">รหัสผ่านนี้แสดงเพียงครั้งเดียว · ปิดหน้าต่างนี้แล้วจะเรียกดูย้อนหลังไม่ได้ (ระบบเก็บเป็นค่าที่ย้อนกลับไม่ได้) · หากลืม ให้ตั้งรหัสใหม่<\u002Fdiv>\n      <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:8px;padding:13px 14px;background:#f6f8f7;border:1px solid #d9e3df\">\n        <div style=\"display:flex;gap:8px;font-size:12.5px;line-height:1.6\"><span style=\"flex:0 0 64px;color:#7a7466\">ลิงก์<\u002Fspan><span style=\"flex:1 1 auto;min-width:0;font-family:'IBM Plex Mono',monospace;word-break:break-all\">{{ credUrl }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:8px;font-size:13.5px;line-height:1.6\"><span style=\"flex:0 0 64px;color:#7a7466;font-size:12.5px\">ชื่อผู้ใช้<\u002Fspan><span style=\"flex:1 1 auto;min-width:0;font-family:'IBM Plex Mono',monospace;font-weight:700;word-break:break-all\">{{ credUser }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:8px;font-size:13.5px;line-height:1.6\"><span style=\"flex:0 0 64px;color:#7a7466;font-size:12.5px\">รหัสผ่าน<\u002Fspan><span style=\"flex:1 1 auto;min-width:0;font-family:'IBM Plex Mono',monospace;font-weight:700;word-break:break-all\">{{ credPass }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:8px;font-size:12.5px;line-height:1.6\"><span style=\"flex:0 0 64px;color:#7a7466\">สิทธิ์<\u002Fspan><span style=\"flex:1 1 auto;min-width:0\">{{ credRoleText }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onCredCopy }}\" style=\"display:block;width:100%;margin-top:12px;padding:13px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:15px;font-weight:600;border-radius:2px;cursor:pointer\">{{ credCopyLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onCredClose }}\" style=\"display:block;width:100%;margin-top:8px;padding:11px 16px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:14px;border-radius:2px;cursor:pointer\">ปิด<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ noBackend }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:#f6f4ef\">\n    <div style=\"width:100%;max-width:460px;background:#fffefb;border:1px solid #e3ded2;padding:28px 24px;text-align:center\">\n      <h1 style=\"margin:0;font-size:19px;font-weight:700;line-height:1.4\">ระบบยังไม่พร้อมใช้งานชั่วคราว<\u002Fh1>\n      <div style=\"margin-top:10px;font-size:13px;color:#5d574b;line-height:1.8\">ไม่สามารถติดต่อฐานข้อมูลกลางของคริสตจักรได้ในขณะนี้<br>กรุณาลองใหม่อีกครั้ง หรือแจ้งประธานธรรมกิจ<\u002Fdiv>\n      <div style=\"margin-top:16px;font-size:11.5px;color:#a09884;line-height:1.7\">ผู้ใช้งานไม่ต้องตั้งค่าใด ๆ ด้วยตนเอง<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ needSetup }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:#f6f4ef\">\n    <div style=\"width:100%;max-width:520px;background:#fffefb;border:1px solid #e3ded2;box-shadow:0 12px 40px -28px rgba(25,24,23,.4);padding:30px 26px 26px\">\n      <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:#7a7466\">setup required<\u002Fdiv>\n      <h1 style=\"margin:8px 0 0;font-size:21px;font-weight:700;line-height:1.35\">ตรวจสอบคุณสมบัติสมาชิกและการเข้าร่วมนมัสการ<\u002Fh1>\n      <div style=\"margin-top:4px;font-size:13px;color:#5d574b;line-height:1.7\">คริสตจักรคอร์เนอร์สโตน หัวหิน · จัดทำระบบโดย มน.สมเจต เสมาทอง ประธานธรรมกิจคริสตจักร<\u002Fdiv>\n      <div style=\"margin-top:20px;padding:14px 16px;background:#f6f8f7;border:1px solid #d9e3df\">\n        <div style=\"font-size:13.5px;font-weight:700;color:#1f5b4e\">ยังไม่ได้ผูกกับฐานข้อมูลกลาง<\u002Fdiv>\n        <div style=\"font-size:12px;color:#41544d;margin:6px 0 10px;line-height:1.8\">วางที่อยู่ (URL) ของฐานข้อมูลกลางที่ติดตั้งไว้ตามคู่มือ แล้วกดทดสอบ · ระบบนี้อ่านข้อมูลสมาชิกจากฐานกลางเท่านั้น ไม่มีข้อมูลและไม่มีรหัสใดเก็บอยู่ในไฟล์เว็บ<\u002Fdiv>\n        <input value=\"{{ pfApiUrl }}\" sc-camel-on-input=\"{{ onPfApiUrl }}\" placeholder=\"https://script.google.com/macros/s/…/exec\" style=\"display:block;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfc8b8;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;border-radius:2px;outline:none\">\n        <button sc-camel-on-click=\"{{ onTestApi }}\" style=\"display:block;width:100%;margin-top:10px;padding:13px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:15px;font-weight:600;border-radius:2px;cursor:pointer\">ทดสอบและเชื่อมต่อ<\u002Fbutton>\n        <div style=\"font-size:12px;color:#1f5b4e;margin-top:10px;line-height:1.7\">{{ apiState }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ gate }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;background:#f6f4ef\">\n    <div style=\"width:100%;max-width:400px;background:#fffefb;border:1px solid #e3ded2;box-shadow:0 12px 40px -28px rgba(25,24,23,.4);padding:28px 24px 24px\">\n      <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:#7a7466\">members only<\u002Fdiv>\n      <h1 style=\"margin:8px 0 0;font-size:19px;font-weight:700;line-height:1.4\">ตรวจสอบคุณสมบัติสมาชิกและการเข้าร่วมนมัสการ<\u002Fh1>\n      <div style=\"margin-top:4px;font-size:12.5px;color:#5d574b;line-height:1.7\">คริสตจักรคอร์เนอร์สโตน หัวหิน · กรอกชื่อผู้ใช้และรหัสผ่านที่ประธานธรรมกิจแจ้งให้<\u002Fdiv>\n\n      <sc-if value=\"{{ needBootstrap }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:16px;padding:14px;background:#f6f8f7;border:1px solid #d9e3df\">\n          <div style=\"font-size:13px;font-weight:700;color:#1f5b4e\">ตั้งค่าครั้งแรก — สร้างบัญชีผู้ดูแล<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#41544d;margin-top:5px;line-height:1.8\">ยังไม่มีบัญชีใดในระบบ กำหนดชื่อผู้ใช้และรหัสผ่านของคุณเองที่นี่ · รหัสจะถูกแปลงเป็นค่าที่ย้อนกลับไม่ได้ก่อนบันทึก · เมื่อสร้างเสร็จ ช่องนี้จะปิดถาวร ไม่มีใครสร้างผู้ดูแลเพิ่มได้อีก<\u002Fdiv>\n          <input value=\"{{ bsUser }}\" sc-camel-on-input=\"{{ onBsUser }}\" placeholder=\"ชื่อผู้ใช้ผู้ดูแล\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:11px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px;outline:none\">\n          <input type=\"password\" value=\"{{ bsPass }}\" sc-camel-on-input=\"{{ onBsPass }}\" placeholder=\"รหัสผ่าน (อย่างน้อย 8 ตัว)\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:11px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px;outline:none\">\n          <input type=\"password\" value=\"{{ bsPass2 }}\" sc-camel-on-input=\"{{ onBsPass2 }}\" placeholder=\"พิมพ์รหัสผ่านอีกครั้ง\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:11px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px;outline:none\">\n          <button sc-camel-on-click=\"{{ onBootstrap }}\" style=\"display:block;width:100%;margin-top:10px;padding:13px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:15px;font-weight:600;border-radius:2px;cursor:pointer\">สร้างบัญชีผู้ดูแลและเข้าใช้งาน<\u002Fbutton>\n          <div style=\"font-size:12.5px;color:#8c2f2f;margin-top:8px;line-height:1.6\">{{ gErr }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <input value=\"{{ gEmail }}\" sc-camel-on-input=\"{{ onGEmail }}\" sc-camel-on-key-down=\"{{ onGKey }}\" placeholder=\"ชื่อผู้ใช้ (User)\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:16px;padding:12px 13px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px;outline:none\">\n      <input type=\"password\" value=\"{{ gPass }}\" sc-camel-on-input=\"{{ onGPass }}\" sc-camel-on-key-down=\"{{ onGKey }}\" placeholder=\"รหัสผ่าน (Password)\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:12px 13px;border:1px solid #cfc8b8;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:14px;border-radius:2px;outline:none\">\n      <button sc-camel-on-click=\"{{ onGateLogin }}\" style=\"display:block;width:100%;margin-top:10px;padding:13px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:15px;font-weight:600;border-radius:2px;cursor:pointer\">เข้าดูข้อมูล<\u002Fbutton>\n      <div style=\"font-size:12.5px;color:#8c2f2f;margin-top:10px;line-height:1.6\">{{ gErr }}<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px\">\n        <button sc-camel-on-click=\"{{ onProbe }}\" style=\"padding:7px 12px;border:1px solid #cfc8b8;background:#fff;color:#6b6459;font-family:inherit;font-size:11.5px;border-radius:3px;cursor:pointer\">ทดสอบการเชื่อมต่อ<\u002Fbutton>\n        <div style=\"font-size:11.5px;color:#8a8477\">{{ probeMsg }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ probeOut }}\" hint-placeholder-val=\"{{ false }}\">\n        <pre style=\"margin-top:10px;padding:10px 12px;background:#f5f2ea;border:1px solid #e2ddd0;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.7;color:#4a453d;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto\">{{ probeOut }}<\u002Fpre>\n      <\u002Fsc-if>\n      <div style=\"margin-top:14px;font-size:11px;color:#a09884;line-height:1.7\">ข้อมูลนี้เป็นข้อมูลภายในของคริสตจักร โปรดไม่ส่งต่อ<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ authed }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"pagewrap\" style=\"min-height:100vh;padding:28px 20px 64px\">\n  <div class=\"sheet\" style=\"max-width:1320px;margin:0 auto;background:#fffefb;border:1px solid #e3ded2;box-shadow:0 1px 0 #e9e4d8,0 12px 40px -28px rgba(25,24,23,.35);padding:32px 34px 40px\">\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #191817;padding-bottom:11px\">\n      <div style=\"flex:1 1 300px;min-width:0\">\n        <div style=\"font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:#7a7466\">worship register + members list / audit<\u002Fdiv>\n        <h1 style=\"margin:3px 0 0;font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.25\">ตรวจสอบคุณสมบัติสมาชิกและการเข้าร่วมนมัสการ<\u002Fh1>\n        <div style=\"margin-top:3px;font-size:12.5px;color:#5d574b;line-height:1.5\">เรียงจากผู้ที่เป็นสมาชิกเก่าที่สุดและมาต่อเนื่อง · จัดทำระบบโดย มน.สมเจต เสมาทอง ประธานธรรมกิจคริสตจักร · <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#a09884\">{{ buildTag }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 240px;min-width:0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5d574b;line-height:1.6\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;align-items:center;margin-bottom:5px\">\n          <button sc-camel-on-click=\"{{ onToggleRules }}\" title=\"คุณสมบัติสมาชิกและสิทธิ์ออกเสียง\" style=\"display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;font-weight:600;border-radius:2px;cursor:pointer\" style-hover=\"border-color:#1f5b4e;color:#1f5b4e\">\n            <span style=\"font-family:'IBM Plex Mono',monospace\">ⓘ<\u002Fspan>คุณสมบัติสมาชิก\n          <\u002Fbutton>\n          <span style=\"{{ modeStyle }}\">{{ modeText }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ onLogout }}\" style=\"padding:4px 10px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">ออก<\u002Fbutton>\n        <\u002Fdiv>\n        <div>ทะเบียนสมาชิก {{ memberCount }} คน · บันทึกนมัสการ {{ recordCount }} รายการ / {{ serviceCount }} ครั้ง<\u002Fdiv>\n        <div>{{ rangeText }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showRules }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:18px;padding:18px 20px;background:#faf8f3;border:1px solid #e3ded2\">\n        <div style=\"display:flex;gap:16px;justify-content:space-between;align-items:flex-start\">\n          <div>\n            <div style=\"font-size:15px;font-weight:700\">1. คุณสมบัติ ผู้มีสิทธิ์เข้าร่วมประชุมและออกเสียงโหวต<\u002Fdiv>\n            <div style=\"font-size:12px;color:#7a7466;margin-top:2px\">อ้างอิงระเบียบสมาชิกภาพของคริสตจักร<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onToggleRules }}\" class=\"noprint\" style=\"padding:6px 12px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12px;border-radius:2px;cursor:pointer\">ปิด<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:10px;margin-top:14px\">\n          <sc-for list=\"{{ rules }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"{{ r.cardStyle }}\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"{{ r.numStyle }}\">{{ r.no }}<\u002Fspan>\n                <span style=\"{{ r.titleStyle }}\">{{ r.title }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.8;margin-top:7px;text-wrap:pretty;color:#2b2926\">{{ r.body }}<\u002Fdiv>\n              <div style=\"{{ r.rightStyle }}\">{{ r.right }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:16px;border:1px solid #e3ded2;background:#fffefb;border-radius:2px\">\n          <button sc-camel-on-click=\"{{ onToggleStatusDoc }}\" style=\"{{ statusDocBtnStyle }}\">\n            <span style=\"display:flex;align-items:center;gap:9px;min-width:0\">\n              <span style=\"font-size:15px;font-weight:700;color:#1f5b4e\">คำอธิบายสถานภาพสมาชิก<\u002Fspan>\n              <span style=\"font-size:11.5px;color:#7a7466;font-weight:400\">แต่ละสถานภาพหมายถึงอะไร มีสิทธิ์อย่างไร<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"{{ statusDocCaretStyle }}\">▾<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ statusDocOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:4px 18px 20px;border-top:1px solid #eee9dd\">\n              <sc-for list=\"{{ statusDoc }}\" as=\"s\" hint-placeholder-count=\"7\">\n                <div style=\"margin-top:18px\">\n                  <div style=\"{{ s.headStyle }}\">{{ s.head }}<\u002Fdiv>\n                  <sc-for list=\"{{ s.paras }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <div style=\"{{ p.style }}\">{{ p.text }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 6px\">\n      <div style=\"flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(146px,48%),1fr));gap:6px\">\n        <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"16\">\n          <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">\n            <div style=\"{{ f.labelStyle }}\">{{ f.label }}<\u002Fdiv>\n            <div style=\"{{ f.countStyle }}\">{{ f.count }}<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ notRegistrar }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-raw-select value=\"{{ tierSel }}\" sc-camel-on-change=\"{{ onTier }}\" style=\"flex:1 1 200px;min-width:0;max-width:100%;padding:10px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px\">\n          <sc-for list=\"{{ tierOptions }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <option value=\"{{ t.value }}\">{{ t.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <sc-raw-select value=\"{{ group }}\" sc-camel-on-change=\"{{ onGroup }}\" style=\"flex:0 1 auto;min-width:0;max-width:100%;padding:10px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px\">\n          <sc-for list=\"{{ groupOptions }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <option value=\"{{ g.value }}\">{{ g.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ onPrint }}\" style=\"padding:10px 18px;border:1px solid #191817;background:#191817;color:#fffefb;font-family:inherit;font-size:14px;font-weight:600;border-radius:2px;cursor:pointer\" style-hover=\"background:#1f5b4e;border-color:#1f5b4e\">พิมพ์ / บันทึก PDF<\u002Fbutton>\n      <sc-if value=\"{{ editable }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ onToggleAdmin }}\" style=\"{{ adminBtnStyle }}\">{{ adminBtnLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ onOpenProfile }}\" style=\"padding:10px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:14px;font-weight:600;border-radius:2px;cursor:pointer\">โปรไฟล์ผู้ดูแล<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showLoadBar }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:11px 14px;margin:12px 0 0;background:#f6f8f7;border:1px solid #d9e3df\">\n        <div style=\"flex:1 1 240px;min-width:0;font-size:13px;color:#1f5b4e;line-height:1.6\">{{ loadMsg }}<\u002Fdiv>\n        <div style=\"flex:1 1 240px;min-width:0;font-size:13px;color:#8c2f2f;line-height:1.6\">{{ loadErr }}<\u002Fdiv>\n        <sc-if value=\"{{ loadErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ onRetryLoad }}\" style=\"padding:9px 15px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:13px;font-weight:600;border-radius:2px;cursor:pointer\">ลองโหลดอีกครั้ง<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showImport }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;margin:14px 0 0;background:#f6f8f7;border:1px solid #d9e3df\">\n        <div style=\"flex:1 1 100%;font-size:12.5px;color:#41544d;line-height:1.6\">\n          <b>อัปเดตข้อมูลจาก Google Sheet<\u002Fb> — ดาวน์โหลดเป็น CSV แล้วเลือกไฟล์ <span style=\"font-family:'IBM Plex Mono',monospace\">MembersList<\u002Fspan> และ <span style=\"font-family:'IBM Plex Mono',monospace\">worshipRegister<\u002Fspan> (ทีเดียว 2 ไฟล์ หรือทีละไฟล์) · เก็บไว้ในเครื่องนี้ · สถานะที่ปรับไว้เองไม่หาย\n        <\u002Fdiv>\n        <div style=\"flex:1 1 100%;display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ partFiles }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"{{ p.style }}\">\n              <span style=\"{{ p.markStyle }}\">{{ p.mark }}<\u002Fspan>\n              <span style=\"flex:1 1 150px;min-width:0\">{{ p.label }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5d574b\">{{ p.name }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#7a7466\">{{ p.count }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <label style=\"display:inline-flex;align-items:center;gap:6px;padding:11px 16px;border:1px solid #1f5b4e;background:#fff;color:#1f5b4e;font-family:inherit;font-size:14px;font-weight:600;border-radius:2px;cursor:pointer\">\n          ⬆ เลือกไฟล์ CSV\n          <input type=\"file\" accept=\".csv,text/csv\" multiple=\"\" sc-camel-on-change=\"{{ onImport }}\" style=\"display:none\">\n        <\u002Flabel>\n        <button sc-camel-on-click=\"{{ onApplyParts }}\" style=\"padding:11px 16px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:14px;font-weight:700;border-radius:2px;cursor:pointer\">บันทึกและแสดงข้อมูล<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onClearImport }}\" style=\"padding:11px 14px;border:1px solid #cfc8b8;background:#fff;color:#8c2f2f;font-family:inherit;font-size:13px;border-radius:2px;cursor:pointer\">ล้างข้อมูลที่นำเข้า<\u002Fbutton>\n        <div style=\"flex:1 1 100%;font-size:12px;color:#1f5b4e;line-height:1.6\">{{ importMsg }}{{ importedAt }}<\u002Fdiv>\n        <div style=\"flex:1 1 100%;font-size:12px;color:#8c2f2f;line-height:1.6\">{{ importErr }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;margin:10px 0 4px;background:#f6f8f7;border:1px solid #d9e3df\">\n        <div style=\"flex:1 1 300px;min-width:0;font-size:12.5px;color:#41544d;line-height:1.6\">แก้สถานะได้ที่ป้ายผลตรวจในตาราง ({{ overrideCount }} รายชื่อถูกกำหนดเอง) แล้วกดบันทึก · การแก้ไขเก็บในเครื่องนี้ · ถ้าต้องการให้ทีมงานเห็นด้วย ให้เปิดโปรไฟล์แล้วกด “บันทึกและสร้างไฟล์ใหม่” เพื่อนำไปอัปทับบน GitHub<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onSave }}\" style=\"{{ saveStyle }}\">{{ saveLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onReset }}\" style=\"padding:10px 14px;border:1px solid #cfc8b8;background:#fff;color:#8c2f2f;font-family:inherit;font-size:13px;border-radius:2px;cursor:pointer\" style-hover=\"border-color:#8c2f2f\">ล้างการปรับทั้งหมด<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:12px 14px;margin:12px 0 4px;background:#f3f5f7;border:1px solid #dde3e8;font-size:12.5px;color:#3c4a57;line-height:1.6\">{{ lockedNote }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <input class=\"noprint\" type=\"search\" sc-camel-input-mode=\"search\" sc-camel-auto-complete=\"off\" sc-camel-auto-correct=\"off\" sc-camel-auto-capitalize=\"off\" sc-camel-spell-check=\"{{ false }}\" sc-camel-on-input=\"{{ onQuery }}\" sc-camel-on-composition-end=\"{{ onQuery }}\" placeholder=\"ค้นหาชื่อ / ชื่อเล่น / รหัส / หมายเหตุ\" style=\"display:block;width:100%;box-sizing:border-box;margin:16px 0 0;padding:10px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px;outline:none\">\n    <div class=\"printonly\" style=\"margin:0 0 6pt;padding:0 0 4pt;border-bottom:1.2pt solid #191817\">\n      <div style=\"font-size:9pt;line-height:1.5;color:#191817\">{{ printLine1 }}<\u002Fdiv>\n      <div style=\"font-size:9pt;line-height:1.5;color:#191817;font-weight:600\">{{ printLine2 }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"noprint\" style=\"font-size:12.5px;color:#5d574b;margin:12px 0 10px\"><b>{{ selectionText }}<\u002Fb> · แสดง {{ shownCount }} รายชื่อ<\u002Fdiv>\n\n    <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px\">\n        <sc-for list=\"{{ heads }}\" as=\"h\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ h.onClick }}\" style=\"{{ h.chipStyle }}\">{{ h.label }} {{ h.arrow }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n          <div style=\"{{ r.cardStyle }}\">\n            <div style=\"display:flex;gap:10px;align-items:flex-start\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7a7466;padding-top:2px;min-width:28px\">{{ r.rank }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-weight:600;font-size:15px;line-height:1.4;text-wrap:pretty\">{{ r.name }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#7a7466;margin-top:3px;line-height:1.5\">{{ r.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;margin-top:9px\">\n              <button sc-camel-on-click=\"{{ r.onBadge }}\" style=\"{{ r.badgeStyle }}\">{{ r.badge }}<span style=\"opacity:.7;font-size:9px\">{{ r.caret }}<\u002Fspan><\u002Fbutton><sc-if value=\"{{ r.follow6 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ r.follow6Style }}\" title=\"ธงติดตามภายใน ไม่ใช่การเปลี่ยนสถานะทะเบียน\">ติดตาม 6 เดือน<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ r.menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"noprint\" style=\"position:absolute;z-index:20;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid #cfc8b8;box-shadow:0 8px 24px -10px rgba(25,24,23,.4);border-radius:2px;overflow:hidden;min-width:190px\">\n                  <sc-for list=\"{{ r.menuItems }}\" as=\"m\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;margin-top:6px;line-height:1.5;color:{{ r.flagColor }};font-weight:{{ r.flagWeight }}\">{{ r.flag }}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px 10px;margin-top:10px;padding-top:9px;border-top:1px solid #eee9dd\">\n              <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"7\">\n                <div style=\"min-width:0\">\n                  <div style=\"font-size:10px;color:#8a8477;letter-spacing:.03em\">{{ c.k }}<\u002Fdiv>\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#191817;margin-top:1px\">{{ c.v }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;margin-top:9px\">\n              <div style=\"flex:1;height:6px;background:#eae5d9;position:relative;overflow:hidden\">\n                <div style=\"{{ r.barStyle }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5d574b\">{{ r.contText }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ r.canEdit }}\" hint-placeholder-val=\"{{ false }}\">\n              <button class=\"noprint\" sc-camel-on-click=\"{{ r.onEdit }}\" style=\"margin-top:10px;width:100%;min-height:44px;padding:0 12px;border:1px solid #cfdcd7;background:#fff;color:#1f5b4e;font-family:inherit;font-size:13px;font-weight:600;border-radius:2px;cursor:pointer\">แก้ไขข้อมูล<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"scroller\" style=\"{{ tableWrapStyle }}\">\n    <sc-raw-table style=\"width:100%;min-width:1240px;border-collapse:collapse;font-size:13px\">\n      <sc-raw-thead>\n        <sc-raw-tr style=\"background:#f1eee6\">\n          <sc-raw-th style=\"text-align:right;padding:9px 8px;border-bottom:1.5px solid #191817;font-weight:600;white-space:nowrap;width:40px\">#<\u002Fsc-raw-th>\n          <sc-for list=\"{{ heads }}\" as=\"h\" hint-placeholder-count=\"9\">\n            <sc-raw-th style=\"{{ h.thStyle }}\" title=\"{{ h.title }}\">\n              <button sc-camel-on-click=\"{{ h.onClick }}\" style=\"{{ h.btnStyle }}\">{{ h.label }}<span style=\"{{ h.arrowStyle }}\">{{ h.arrow }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-raw-th>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"14\">\n          <sc-raw-tr style=\"{{ r.rowStyle }}\">\n            <sc-raw-td style=\"text-align:right;padding:8px;font-family:'IBM Plex Mono',monospace;color:#7a7466;vertical-align:top;white-space:nowrap\">{{ r.rank }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px 10px;vertical-align:top\">\n              <div style=\"font-weight:600\">{{ r.name }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#7a7466;margin-top:2px\">{{ r.meta }}<\u002Fdiv>\n              <sc-if value=\"{{ r.canEdit }}\" hint-placeholder-val=\"{{ false }}\">\n                <button class=\"noprint\" sc-camel-on-click=\"{{ r.onEdit }}\" style=\"margin-top:5px;padding:3px 9px;border:1px solid #cfdcd7;background:#fff;color:#1f5b4e;font-family:inherit;font-size:11px;border-radius:2px;cursor:pointer\" style-hover=\"background:#1f5b4e;color:#fffefb\">แก้ไขข้อมูล<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px 10px;vertical-align:top\">\n              <div style=\"position:relative\">\n                <button sc-camel-on-click=\"{{ r.onBadge }}\" style=\"{{ r.badgeStyle }}\">{{ r.badge }}<span style=\"opacity:.7;font-size:9px\">{{ r.caret }}<\u002Fspan><\u002Fbutton><sc-if value=\"{{ r.follow6 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ r.follow6Style }}\" title=\"ธงติดตามภายใน ไม่ใช่การเปลี่ยนสถานะทะเบียน\">ติดตาม 6 เดือน<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ r.menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"noprint\" style=\"position:absolute;z-index:20;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid #cfc8b8;box-shadow:0 8px 24px -10px rgba(25,24,23,.4);border-radius:2px;overflow:hidden;min-width:170px\">\n                    <sc-for list=\"{{ r.menuItems }}\" as=\"m\" hint-placeholder-count=\"3\">\n                      <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div class=\"flagnote\" style=\"font-size:10.5px;margin-top:4px;color:{{ r.flagColor }};font-weight:{{ r.flagWeight }}\">{{ r.flag }}<\u002Fdiv>\n            <\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;font-family:'IBM Plex Mono',monospace;vertical-align:top;white-space:nowrap\">{{ r.join }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;font-family:'IBM Plex Mono',monospace;vertical-align:top;white-space:nowrap;color:#5d574b\">{{ r.first }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;text-align:right;font-family:'IBM Plex Mono',monospace;vertical-align:top;white-space:nowrap\">{{ r.tenure }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;vertical-align:top;white-space:nowrap\">{{ r.visits }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;text-align:right;font-family:'IBM Plex Mono',monospace;vertical-align:top;white-space:nowrap\">{{ r.recent }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px 10px;vertical-align:top\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <div style=\"flex:1;height:6px;background:#eae5d9;position:relative;overflow:hidden\">\n                  <div style=\"{{ r.barStyle }}\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5d574b;width:34px;text-align:right\">{{ r.contText }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:8px;font-family:'IBM Plex Mono',monospace;vertical-align:top;white-space:nowrap;color:{{ r.lastColor }}\">{{ r.last }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:24px;padding-top:14px;border-top:1px solid #e3ded2;font-size:11.5px;color:#7a7466;line-height:1.8\">\n      <div><b>สถานะทางทะเบียนกับผลวิเคราะห์แยกกัน<\u002Fb> คอลัมน์ “ผลตรวจ” คือผลการวิเคราะห์จากประวัติการนมัสการเพื่อใช้ประกอบการพิจารณาของคณะธรรมกิจ ไม่ใช่การเปลี่ยนสถานภาพทางทะเบียนอัตโนมัติ · สถานะตามทะเบียนเดิมแสดงอยู่ใต้ชื่อของแต่ละคน · การเปลี่ยนสถานภาพต้องผ่านขั้นตอนและมติที่เกี่ยวข้อง · เกณฑ์วิเคราะห์เพิ่มเติม “เข้าเกณฑ์เข้มแข็ง” คือผู้ที่มีความต่อเนื่องในการนมัสการตั้งแต่ 50% ขึ้นไปของจำนวนครั้งที่จัดนับจากวันเข้าร่วม (ต่ำกว่า 50% ไม่นับ)<\u002Fdiv>\n      <div><b>การรวมข้อมูล<\u002Fb> ใช้ทะเบียนสมาชิก (MembersList) เป็นข้อมูลหลักของสถานะ/กลุ่ม/รหัส — รายชื่อซ้ำใช้รายการที่อัพเดทล่าสุด — และใช้บันทึกลงชื่อนมัสการคำนวณจำนวนครั้งและความต่อเนื่อง · <b>อายุสมาชิก<\u002Fb> นับจากวันที่เก่ากว่าระหว่างวันเข้าเป็นสมาชิกกับวันนมัสการครั้งแรก<\u002Fdiv>\n      <div><b>ลำดับหมวด<\u002Fb> 1) <b>สมาชิกสมบูรณ์ ประเภท 1<\u002Fb> (ทะเบียนระบุเป็นสมาชิกสมบูรณ์ และร่วมนมัสการภายใน 1 ปีที่ผ่านมา — มีสิทธิ์ครบทุกประการ เรียงจากผู้ที่เป็นสมาชิกเก่าที่สุด) → 2) <b>สมาชิกสมบูรณ์ ประเภท 2<\u002Fb> (ขาดการนมัสการครบ 1 ปีตามปฏิทิน — ยังเป็นสมาชิกสมบูรณ์และมีสิทธิ์ทุกประการ ยกเว้นไม่มีสิทธิ์ออกเสียงลงคะแนนและไม่มีสิทธิ์ถูกเสนอชื่อ · ข้อ 93.4(4)) → 3) <b>สมาชิกสมบูรณ์ ประเภท 2 · ควรนำเข้าพิจารณา<\u002Fb> (ขาดต่อเนื่องจนครบ 3 ปี คณะธรรมกิจควรนำเข้าพิจารณาให้คงสถานภาพเป็นสมาชิกสำรอง · ข้อ 93.4(4)) → 4) สมาชิกสำรอง → 5) สมาชิกสำรอง · เข้าเกณฑ์ติดตาม (ขาดครบ 1 ปี) → 6) สมาชิกสำรอง · ควรนำเข้าพิจารณา (ขาดครบ 3 ปี · ข้อ 94.6(4)) → 7) ผู้ร่วมนมัสการ → 8) ลาออก → 9) ย้ายสังกัด → 10) ให้ออกโดยมติธรรมกิจ (ประพฤติผิดร้ายแรง) → 11) เสียชีวิต<\u002Fdiv>\n      <div><b>สมบูรณ์ 1 กับ สมบูรณ์ 2 ต่างกันที่สิทธิ์ออกเสียงเท่านั้น<\u002Fb> ประเภท 2 ยังเป็นสมาชิกสมบูรณ์เต็มตัว ร่วมพิธีมหาสนิท เข้าประชุมสัปปุรุษ และรับสวัสดิการได้ตามปกติ — ไม่มีสิทธิ์โหวด หรือถูกเสนอชื่อ เท่านั้น · กลับเป็นประเภท 1 โดยอัตโนมัติเมื่อกลับมาร่วมนมัสการ · จุดเปลี่ยน 1 ปี และ 3 ปี นับตามเดือนปฏิทินจริงจากวันนมัสการครั้งล่าสุด<\u002Fdiv>\n      <div><b>ธงติดตาม 6 เดือน<\u002Fb> เป็นสัญญาณเตือนล่วงหน้าก่อนถึงจุดเปลี่ยน 1 ปี ขึ้นเฉพาะผู้ที่ขาดครบ 6 เดือนแต่ยังไม่ถึง 1 ปีเท่านั้น (ผู้ที่ถึงเกณฑ์ 1 ปีหรือ 3 ปีแล้ว ป้ายหลักระบุไว้ชัดเจนอยู่แล้ว จึงไม่ติดธงซ้ำ) เป็นเกณฑ์ภายในของผู้ดูแลเพื่อเตรียมติดต่อ เยี่ยม หรือสอบถามล่วงหน้า — ไม่ใช่สถานะทางทะเบียน ไม่ลดขั้นเป็นสมาชิกสำรอง ไม่งดสิทธิ์ใด ๆ และไม่ถือเป็นคำวินิจฉัยตามระเบียบสมาชิกภาพ · ผู้ที่ติดธงนี้ยังคงสถานะเดิมทุกประการ เช่น “สมาชิกสมบูรณ์” · เกณฑ์ 1 ปี และ 3 ปี ก็เป็นผลวิเคราะห์เช่นกัน สถานะจะเปลี่ยนได้ต่อเมื่อมีมติและบันทึกไว้ในระบบเท่านั้น<\u002Fdiv>\n      <div><b>ระดับการขาดการนมัสการ<\u002Fb> คำขยายใต้ป้ายแบ่งระดับด้วยสีต่างกัน ไล่แดงเข้มขึ้นทุกปี — เกิน 1 ปี (ส้มแดง) · 2 ปี (แดง) · 3 ปี (แดงเข้ม) · 4 ปีขึ้นไป (แดงเข้มสุด) เรียงจากขาดน้อยที่สุดไปมากที่สุด · เลือกดูแยกแต่ละระดับได้จากดรอปดาวน์คุณสมบัติ<\u002Fdiv>\n      <div><b>การขาดการนมัสการ<\u002Fb> คำนวณจากวันที่ลงชื่อนมัสการครั้งล่าสุดถึงวันที่จริงของวันที่เปิดเว็บ (ผู้ที่ไม่มีบันทึกลงชื่อเลย นับจากวันเข้าเป็นสมาชิก) · ใต้ป้ายมีตัวเลขจริงว่าขาดไปกี่เดือนกี่วัน เรียงจากขาดน้อยไปมาก · ผู้ดูแลคลิกป้ายผลตรวจเพื่อกำหนดเป็น “สมาชิกสำรอง” “ลาออก” “ย้ายสังกัด” “ให้ออกโดยมติธรรมกิจ” หรือ “เสียชีวิต” ตามมติธรรมกิจ ค่าที่กำหนดถูกบันทึกไว้ในเครื่องและฝังลงในไฟล์แชร์ · เปิดไฟล์ด้วย ?view ท้าย URL ก็จะเป็นโหมดผู้ดูเช่นกัน<\u002Fdiv>\n      <div style=\"margin-top:10px;padding-top:8px;border-top:1px solid #eee9dd;color:#5d574b\">จัดทำระบบโดย <b>มน.สมเจต เสมาทอง<\u002Fb> ประธานธรรมกิจคริสตจักร · <span style=\"font-family:'IBM Plex Mono',monospace\">จัดทำ {{ today }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ decOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"noprint\" style=\"position:fixed;inset:0;z-index:70;background:rgba(25,24,23,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto\">\n    <div style=\"width:100%;max-width:560px;background:#fffefb;border:1px solid #e3ded2;box-shadow:0 24px 60px -30px rgba(25,24,23,.6)\">\n      <div style=\"padding:18px 20px;border-bottom:1px solid #e3ded2\">\n        <div style=\"font-size:16px;font-weight:700\">บันทึกมติคณะธรรมกิจ<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#7a7466;margin-top:3px\">{{ decTitle }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#7a7466;margin-top:2px\">{{ decSubtitle }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:#1f5b4e;font-weight:600;margin-top:6px\">ผลที่จะบันทึก: {{ decValLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:18px 20px;display:flex;flex-direction:column;gap:14px\">\n        <div>\n          <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">วันที่มีมติ<\u002Fdiv>\n          <input type=\"date\" value=\"{{ decDate }}\" sc-camel-on-change=\"{{ onDecDate }}\" style=\"width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px\">\n          <div style=\"font-size:11px;color:#7a7466;margin-top:4px;line-height:1.6\">ใช้เป็นจุดตั้งต้นในการติดตามหลังมติ<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ decNeedsReason }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">เหตุผล (เลือกได้หลายข้อ)<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n              <sc-for list=\"{{ decReasonList }}\" as=\"x\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ x.onClick }}\" style=\"{{ x.style }}\">{{ x.text }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div>\n          <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">หมายเหตุ<\u002Fdiv>\n          <textarea value=\"{{ decNote }}\" sc-camel-on-change=\"{{ onDecNote }}\" placeholder=\"ระบุเพิ่มเติม เช่น รายละเอียดของเหตุผล “อื่น ๆ”\" style=\"width:100%;box-sizing:border-box;min-height:74px;padding:10px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:13.5px;line-height:1.7;border-radius:2px;resize:vertical\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12.5px;font-weight:600;margin-bottom:6px\">วันที่ทบทวนครั้งถัดไป (ไม่บังคับ)<\u002Fdiv>\n          <input type=\"date\" value=\"{{ decReview }}\" sc-camel-on-change=\"{{ onDecReview }}\" style=\"width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:14px;border-radius:2px\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid #e3ded2\">\n        <button sc-camel-on-click=\"{{ onDecCancel }}\" style=\"padding:11px 18px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:14px;border-radius:2px;cursor:pointer\">ยกเลิก<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onDecSave }}\" style=\"padding:11px 20px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:14px;font-weight:600;border-radius:2px;cursor:pointer\">บันทึกมติ<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showProfile }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"noprint\" sc-camel-on-click=\"{{ onBackdrop }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(25,24,23,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto\">\n    <div sc-camel-on-click=\"{{ stopClick }}\" style=\"width:100%;max-width:560px;background:#fffefb;border:1px solid #e3ded2;box-shadow:0 24px 60px -30px rgba(25,24,23,.6)\">\n      <div style=\"position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #e3ded2;background:#fffefb\">\n        <div>\n          <div style=\"font-size:16px;font-weight:700\">โปรไฟล์ผู้ดูแล<\u002Fdiv>\n          <div style=\"font-size:12px;color:#7a7466;margin-top:2px\">{{ adminUser }} · ข้อมูลอัพเดท {{ dataUpdated }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onCloseProfile }}\" style=\"padding:7px 13px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:13px;border-radius:2px;cursor:pointer\">ปิด<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isAdminRole }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:18px 20px;border-bottom:1px solid #eee9dd;background:#f6f8f7\">\n        <div style=\"font-size:13.5px;font-weight:700\">อัปเดตข้อมูลจาก Google Sheet<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#41544d;margin:4px 0 10px;line-height:1.75\">เปิด Google Sheet → ไฟล์ → ดาวน์โหลด → <b>ค่าที่คั่นด้วยจุลภาค (.csv)<\u002Fb> ทีละแท็บ แล้วเลือกทั้ง 2 ไฟล์พร้อมกันในช่องด้านล่าง<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:10px;padding:10px 12px;background:#fffefb;border:1px solid #d9e3df\">\n          <div style=\"font-size:11px;color:#7a7466;font-weight:600\">ไฟล์ที่ต้องอัปโหลด 2 ไฟล์<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12.5px;color:#2b2926\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;background:#eef3f1;border:1px solid #cfdcd7;padding:2px 7px;border-radius:2px\">MembersList.csv<\u002Fspan>\n            <span>ทะเบียนสมาชิก<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12.5px;color:#2b2926\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;background:#eef3f1;border:1px solid #cfdcd7;padding:2px 7px;border-radius:2px\">worshipRegister.csv<\u002Fspan>\n            <span>บันทึกลงชื่อนมัสการ<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <input type=\"file\" accept=\".csv,text/csv\" multiple=\"\" sc-camel-on-change=\"{{ onImport }}\" style=\"display:block;width:100%;box-sizing:border-box;padding:10px;border:1px dashed #9db3ab;background:#fff;font-family:inherit;font-size:13px;border-radius:2px\">\n        <div style=\"font-size:11.5px;color:#41544d;margin-top:8px;line-height:1.7\">ระบบจะคำนวณใหม่จากข้อมูลล่าสุด <b>โดยที่สถานะที่คุณปรับไว้เองยังคงอยู่<\u002Fb> · รับเฉพาะไฟล์ .csv (ไฟล์ .xlsx อ่านไม่ได้)<\u002Fdiv>\n        <div style=\"font-size:12px;color:#1f5b4e;margin-top:8px;line-height:1.6\">{{ importMsg }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8c2f2f;margin-top:4px;line-height:1.6\">{{ importErr }}<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"padding:18px 20px;border-bottom:1px solid #eee9dd\">\n        <div style=\"font-size:13.5px;font-weight:700;margin-bottom:8px\">ชื่อผู้ใช้ผู้ดูแล<\u002Fdiv>\n        <input value=\"{{ pfUser }}\" sc-camel-on-input=\"{{ onPfUser }}\" style=\"display:block;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:15px;border-radius:2px;outline:none\">\n      <\u002Fdiv>\n\n      <div style=\"padding:18px 20px;border-bottom:1px solid #eee9dd\">\n        <div style=\"font-size:13.5px;font-weight:700\">รหัสผู้ดูแล<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#7a7466;margin:3px 0 8px;line-height:1.6\">พิมพ์รหัสที่ต้องการได้เลย ระบบจะแสดงค้างไว้แบบนี้ · ถ้าจะเปลี่ยนรหัสเข้าไฟล์ที่เข้ารหัส ต้องยาว 10 ตัวขึ้นไป<\u002Fdiv>\n        <input value=\"{{ pfNewPass }}\" sc-camel-on-input=\"{{ onPfNewPass }}\" placeholder=\"รหัสผู้ดูแล\" style=\"display:block;width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfc8b8;background:#fff;font-family:inherit;font-size:15px;border-radius:2px;outline:none\">\n      <\u002Fdiv>\n\n      <div style=\"padding:18px 20px;border-bottom:1px solid #eee9dd;background:#f6f8f7\">\n        <div style=\"font-size:13.5px;font-weight:700;color:#1f5b4e\">ฐานข้อมูลกลาง<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#41544d;margin:5px 0 10px;line-height:1.8\">ระบบเชื่อมกับฐานข้อมูลกลางของคริสตจักรไว้แล้ว ผู้ใช้ทุกเครื่องใช้ค่าเดียวกันโดยอัตโนมัติ — ไม่มีใครต้องตั้งค่าเอง<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <button sc-camel-on-click=\"{{ onTestApi }}\" style=\"padding:10px 15px;border:1px solid #1f5b4e;background:#1f5b4e;color:#fffefb;font-family:inherit;font-size:13px;font-weight:600;border-radius:2px;cursor:pointer\">ทดสอบการเชื่อมต่อ<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onMeasure }}\" style=\"padding:10px 15px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:13px;border-radius:2px;cursor:pointer\">วัดเวลาที่ใช้แต่ละขั้น<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#7a7466;line-height:1.7\">หน้าเว็บเก็บเพียงที่อยู่ของฐานข้อมูลกลาง ไม่มีรหัสลับหรือกุญแจใด ๆ · ทุกคำสั่งต้องผ่านการยืนยันตัวตนและตรวจสิทธิ์ที่เซิร์ฟเวอร์<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:#1f5b4e;margin-top:8px;line-height:1.7\">{{ apiState }}<\u002Fdiv>\n        <div style=\"margin-top:12px;padding-top:12px;border-top:1px dashed #e3ded2\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n            <button sc-camel-on-click=\"{{ onDiagRun }}\" style=\"padding:10px 15px;border:1px solid #191817;background:#191817;color:#fffefb;font-family:inherit;font-size:13px;font-weight:600;border-radius:2px;cursor:pointer\">ตรวจการเชื่อมต่อ<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onDiagCopy }}\" style=\"padding:10px 15px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:13px;border-radius:2px;cursor:pointer\">{{ diagCopyLabel }}<\u002Fbutton>\n            <span style=\"font-size:11.5px;color:#7a7466;font-family:'IBM Plex Mono',monospace\">{{ buildLine }}<\u002Fspan>\n          <\u002Fdiv>\n          <textarea readonly=\"\" value=\"{{ diagText }}\" placeholder=\"กด “ตรวจการเชื่อมต่อ” เพื่อดูรายงานที่ส่งให้ผู้พัฒนาได้\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:9px;min-height:132px;padding:10px 12px;border:1px solid #cfc8b8;background:#fbfaf6;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.7;border-radius:2px;resize:vertical\"><\u002Ftextarea>\n          <div style=\"font-size:11px;color:#7a7466;margin-top:6px;line-height:1.7\">รายงานนี้ไม่มีรหัสผ่าน token หรือข้อมูลส่วนบุคคลของสมาชิก<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isAdminRole }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:18px 20px;border-bottom:1px solid #eee9dd\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\">\n            <div style=\"font-size:13.5px;font-weight:700\">บัญชีผู้ใช้งาน (ฐานข้อมูลกลาง)<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onRefreshAccounts }}\" style=\"padding:7px 12px;border:1px solid #cfc8b8;background:#fff;color:#5d574b;font-family:inherit;font-size:12.5px;border-radius:2px;cursor:pointer\">รีเฟรช<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#7a7466;margin-top:6px;line-height:1.6\">{{ acctLoadingText }}<\u002Fdiv>\n          <sc-if value=\"{{ acctMsg }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:8px;padding:9px 12px;background:#eef3f1;border:1px solid #cfdcd7;font-size:12.5px;font-weight:600;color:#1f5b4e;line-height:1.6\">{{ acctMsg }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ ac
